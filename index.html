      function spawnStageBoss() {
        if (superBonusTimer > 0 || headStartTargetDist > 0) return;
        const loopBonus = 1 + Math.floor(bossCycleCount / BOSS_ROSTER.length) * 0.25;
        const tpl = BOSS_ROSTER[bossCycleCount % BOSS_ROSTER.length];
        bossCycleCount += 1;
        const scaledHp = Math.round(tpl.hp * loopBonus);
        activeBoss = {
          tier: tpl.tier, tierLbl: tpl.tierLbl, tierBg: tpl.tierBg,
          kind: tpl.kind, sprite: tpl.sprite, name: tpl.name,
          maxHp: scaledHp, hp: scaledHp,
          dmgRate: tpl.dmgRate, dmgBudget: 16, maxBudget: 22, counterCd: 0,
          phase: 1, maxPhases: tpl.phases, reward: tpl.reward,
          worldX: player.x + 320, yOff: 0,
          actionTimer: 1.35, skillIdx: 0,
          windupKind: null, windupTimer: 0, windupMax: 0.72,
          chargePhase: null, chargeTimer: 0,
          slamPhase: null, slamTimer: 0,
          stunTimer: 0, flashTimer: 0, spawnMs: performance.now()
        };
        bossHazards = [];
        refreshBossHudUI();
        bossHud.classList.remove('hidden');
        showToast(`⚠️ ${tpl.tierLbl}魔王降临：${tpl.name}!`);
        playSfx('crater');
      }

      function hitBoss(dmg, causesStun = false, isCounter = false) {
        if (!activeBoss) return;
        const mult = activeBoss.stunTimer > 0 ? 1.2 : 1.0;
        let dealt = Math.min(dmg * mult, Math.max(0, activeBoss.dmgBudget));
        activeBoss.dmgBudget = Math.max(0, activeBoss.dmgBudget - dealt);
        if (isCounter && activeBoss.counterCd <= 0) {
          dealt += 3.5;
          activeBoss.counterCd = 1.6;
        }
        activeBoss.flashTimer = dealt >= 0.5 ? 0.16 : 0.06;
        if (dealt <= 0.01) return;

        activeBoss.hp = Math.max(0, activeBoss.hp - dealt);
        if (causesStun && activeBoss.stunTimer <= 0 && !activeBoss.chargePhase) {
          activeBoss.stunTimer = isCounter ? 1.15 : 0.55;
        }

        // Check Multi-Phase Enrage Transitions!
        const hpRatio = activeBoss.hp / activeBoss.maxHp;
        let wantPhase = activeBoss.phase;
        if (activeBoss.maxPhases === 2 && hpRatio <= 0.50) wantPhase = Math.max(wantPhase, 2);
        if (activeBoss.maxPhases === 3) {
          if (hpRatio <= 0.66) wantPhase = Math.max(wantPhase, 2);
          if (hpRatio <= 0.33) wantPhase = Math.max(wantPhase, 3);
        }
        if (wantPhase > activeBoss.phase && activeBoss.hp > 0) {
          activeBoss.phase = wantPhase;
          activeBoss.stunTimer = 0;
          activeBoss.actionTimer = 0.45;
          shakeTime = 0.35; shakeMag = 14;
          playSfx('crater');
          const bx = activeBoss.worldX, by = getBaseSurfaceY(bx);
          shockwaves.push({ x: bx, y: by - 45, r: 22, maxR: 340, life: 0.42, color: '#f43f5e', harmless: true });
          spawnBeanFountain(bx - 30, by - 45, 10, 3);
          addPopup(wantPhase === 3 ? '☄️ 三阶灭世暴走!!' : '🔥 二阶狂暴觉醒!!', bx - 35, by - 115, '#fde047', 21);
          showToast(`🔥 ${activeBoss.name} 进入${wantPhase}阶狂暴！小心新绝招!`);
        }

        refreshBossHudUI();

        if (activeBoss.hp <= 0) {
          const bx = activeBoss.worldX, by = getBaseSurfaceY(bx);
          const rewardBeans = activeBoss.reward || 120;
          const bossName = activeBoss.name;
          spawnBeanFountain(bx, by - 30, 26, 5);
          hitStopTimer = 0.10; shakeTime = 0.42; shakeMag = 16;
          playSfx('crate');
          bossHud.classList.add('hidden');
          bossHud.classList.remove('enraged');
          enemyShots = [];
          bossHazards = [];
          activeBoss = null;
          nextBossDist = runStats.dist + 420;
          runStats.beans += rewardBeans;
          if (player.hp < player.maxHp) player.hp += 1;
          addSuperCharge(4.5);
          if (superBonusTimer <= 0) {
            if (superCharge >= 100 && normalPlaySecSinceBonus >= MIN_NORMAL_SEC_FOR_BONUS) triggerSuperBonusStage();
            else showToast(`🏆 击败${bossName} +${rewardBeans}🌿!`);
          }
        }
      }

      function updateTopHUD() {
        const shieldCnt = Math.max(0, player.sawShieldCharges) + (player.mountId ? 1 : 0);
        const shieldStr = shieldCnt > 1 ? `🛡️${shieldCnt}` : (shieldCnt === 1 ? '🛡️' : '');
        hpText.textContent = '❤️'.repeat(Math.max(0, player.hp)) + shieldStr;
        distText.textContent = runStats.dist;
        runBeansText.textContent = runStats.beans;

        const spdRatio = (player.vx / 320).toFixed(1);
        speedText.textContent = `${spdRatio}x⚡`;

        const pct = superBonusTimer > 0 ? (superBonusTimer / SUPER_BONUS_DURATION) * 100 : superCharge;
        superBarFill.style.width = `${Math.min(100, Math.max(0, pct))}%`;
        superBarLbl.textContent = superBonusTimer > 0
          ? `🌈 超级奖励 ${superBonusTimer.toFixed(1)}s`
          : `🌈 超级奖励 ${Math.floor(superCharge)}%`;
      }

      // ==================== MAIN UPDATE LOOP ====================
      let chipUiTick = 0;
      function update(realDt) {
        if (state === 'HUB' || state === 'PAUSED') return;

        if (state === 'DYING') {
          deathSlowTimer -= realDt;
          const slowDt = realDt * 0.28;
          player.x += player.vx * 0.35 * slowDt;
          player.vy += 1200 * slowDt;
          player.y = Math.min(getBaseSurfaceY(player.x), player.y + player.vy * slowDt);
          player.angle += 7.5 * slowDt;
          for (const d of flyingDebris) {
            d.x += d.vx * slowDt; d.y += d.vy * slowDt; d.vy += 900 * slowDt; d.rot += d.vRot * slowDt;
            const gy = getBaseSurfaceY(d.x) - (d.r || 10);
            if (d.y > gy) { d.y = gy; d.vy = -Math.abs(d.vy) * 0.68; }
          }
          if (deathSlowTimer <= 0) finishRunAndOpenHub(false);
          return;
        }

        if (hitStopTimer > 0) { hitStopTimer -= realDt; return; }

        const dt = realDt;
        const h = getHero();

        // Periodic Local Auto-Banking so Refresh NEVER Loses Beans or Checkpoints!
        autoSaveTimer -= realDt;
        if (autoSaveTimer <= 0) {
          autoSaveTimer = 2.0;
          bankRunProgress(false);
        }

        if (quickDashWindowTimer > 0) {
          quickDashWindowTimer -= realDt;
          if (quickDashWindowTimer <= 0) quickDashWrap.classList.add('hidden');
        }

        // BGM scales tempo with distance speed & Super Bonus!
        if (soundOn && audioCtx) {
          bgmTimer -= realDt;
          if (bgmTimer <= 0) {
            const spdFactor = Math.min(1.6, player.vx / 320);
            bgmTimer = superBonusTimer > 0 ? 0.12 : Math.max(0.12, 0.23 / spdFactor);
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'triangle';
            const notes = superBonusTimer > 0 ? BONUS_MELODY : MELODY;
            osc.frequency.setValueAtTime(notes[bgmStep++ % notes.length], now);
            g.gain.setValueAtTime(0.022, now);
            g.gain.exponentialRampToValueAtTime(0.0008, now + 0.13);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.14);
          }
        }

        // Smooth Camera & Sky Interpolation + Rare Super Bonus Pacing (<5% playtime, 10s duration)
        if (superBonusTimer > 0) {
          bonusSkyAlpha = Math.min(1, bonusSkyAlpha + realDt * 2.0);
          superBonusTimer -= realDt;
          if (superBonusTimer <= 0) {
            superBonusTimer = 0;
            // Smooth glide descent from -220 cloud highway down to road (zero screen snap!)
            player.vy = -80;
            player.onGround = false;
            player.invulnTimer = 2.4;
            nextSpawnX = Math.max(nextSpawnX, player.x + 420);
            playSfx('jump');
            showToast('🏁 超级奖励结束 · 继续狂飙!');
          }
        } else {
          bonusSkyAlpha = Math.max(0, bonusSkyAlpha - realDt * 1.8);
          if (headStartTargetDist <= 0) {
            normalPlaySecSinceBonus += realDt;
            addSuperCharge(realDt * 0.34);
          }
        }
        if (stageFadeTimer > 0) stageFadeTimer = Math.max(0, stageFadeTimer - realDt * 1.1);

        const targetZoom = (player.giantTimer > 0 || player.mountId || headStartTargetDist > 0 || superBonusTimer > 0) ? 0.91 : 1.0;
        smoothCamZoom += (targetZoom - smoothCamZoom) * Math.min(1, realDt * 3.5);
        const targetRefY = superBonusTimer > 0 ? -220 : Math.min(player.y, getBaseSurfaceY(player.x) + 45);
        smoothCamRefY += (targetRefY - smoothCamRefY) * Math.min(1, realDt * 5.2);

        if (combo > 0) { comboTimer -= realDt; if (comboTimer <= 0) { combo = 0; comboTag.classList.add('hidden'); } }
        if (shakeTime > 0) shakeTime -= realDt;
        if (player.invulnTimer > 0) player.invulnTimer -= realDt;
        if (player.hurtPoseTimer > 0) player.hurtPoseTimer -= realDt;
        if (player.strikeTimer > 0) player.strikeTimer -= realDt;
        if (player.actionCd > 0) player.actionCd = Math.max(0, player.actionCd - realDt);
        if (player.boostTimer > 0) player.boostTimer -= realDt;
        if (player.giantTimer > 0) player.giantTimer -= realDt;
        if (player.magnetTimer > 0) player.magnetTimer -= realDt;
        if (player.rocketDashTimer > 0) player.rocketDashTimer -= realDt;
        if (player.coyoteTimer > 0) player.coyoteTimer -= realDt;
        if (player.jumpBufferTimer > 0) {
          player.jumpBufferTimer -= realDt;
          if (player.onGround || player.onRail) doJump();
        }

        // Speed Lines whenever going fast (>430 px/s) or dashing!
        if (player.vx > 420 && Math.random() < 0.65) {
          speedLines.push({ x: W + 20, y: Math.random() * H, len: 60 + Math.random() * 90, life: 0.22 });
        }
        for (const sl of speedLines) { sl.x -= 1700 * realDt; sl.life -= realDt; }
        speedLines = speedLines.filter((s) => s.life > 0);

        // Armed Heavy Weapon Auto-Fire!
        if (player.weaponTimer > 0) {
          player.weaponTimer -= realDt;
          player.autoFireTick -= realDt;
          if (player.weaponId === 'gatling' && player.autoFireTick <= 0) {
            player.autoFireTick = 0.22;
            projectiles.push({ kind: 'ikun_pinball', x: player.x + 54, y: player.y - 64, vx: player.vx + 820, vy: (Math.random() - 0.5) * 60, bouncesLeft: 2, r: 13, rot: 0, life: 1.4, homing: true, trail: [] });
            playSfx('slash');
          } else if (actionHeld && player.actionCd <= 0) {
            onActionPress();
          }
          if (player.weaponTimer <= 0) { player.weaponId = null; syncControlsUI(); }
        }

        if (player.mountTimer > 0) {
          player.mountTimer -= realDt;
          if (player.mountId === 'biplane' && superBonusTimer <= 0 && headStartTargetDist <= 0) {
            const baseG = getBaseSurfaceY(player.x);
            if (jumpHeld) player.vy -= 1100 * realDt;
            else player.vy += 650 * realDt;
            player.vy = Math.max(-280, Math.min(260, player.vy));
            player.y = Math.max(baseG - 215, Math.min(baseG - 58, player.y + player.vy * realDt));
            player.autoFireTick -= realDt;
            if (player.autoFireTick <= 0) {
              player.autoFireTick = 0.34;
              projectiles.push({ kind: 'fish_shot', x: player.x + 42, y: player.y - 12, vx: player.vx + 380, vy: 340, r: 16, rot: 0, life: 1.5 });
            }
          }
          if (player.mountTimer <= 0) { player.mountId = null; syncControlsUI(); }
        }

        if (player.orbitSawTimer > 0) {
          player.orbitSawTimer -= realDt;
          const baseA = performance.now() * 0.01;
          for (let k = 0; k < 2; k++) {
            const a = baseA + k * Math.PI;
            const sx = player.x + Math.cos(a) * 78, sy = (player.y - 46) + Math.sin(a) * 58;
            checkEnvironmentImpactArea(sx, sy, 32);
            for (const en of enemies) {
              if (!en.hit && Math.hypot(en.x - sx, (getEnemyWorldY(en) - 24) - sy) < 46) {
                en.shielded = false; defeatEnemy(en);
              }
            }
          }
        }

        if (player.fishStormTimer > 0) {
          player.fishStormTimer -= realDt;
          if (Math.random() < realDt * 9) {
            projectiles.push({ kind: 'fish_shot', x: player.x + 40 + Math.random() * 360, y: player.y - 240, vx: player.vx + 200, vy: 560, r: 17, rot: 0, life: 1.4 });
          }
        }

        chipUiTick -= realDt;
        if (chipUiTick <= 0) { chipUiTick = 0.25; refreshBuffChips(); }

        for (const sl of player.slashLines) sl.timer -= realDt;
        player.slashLines = player.slashLines.filter((s) => s.timer > 0);
        for (const bl of bells) if (bl.rungTimer > 0) bl.rungTimer -= realDt;
        for (const rl of rails) if (rl.energizedTimer > 0) rl.energizedTimer -= realDt;
        for (const fp of flamePuffs) { fp.x += fp.vx * dt; fp.y += fp.vy * dt - 45 * dt; fp.r += 28 * dt; fp.life -= realDt; }
        flamePuffs = flamePuffs.filter((f) => f.life > 0);

        if (h.id === 'nailong' && !player.weaponId) {
          if (player.flameHolding && player.flameFuel > 0) fireNailoongFlamePulse(realDt);
          else player.flameFuel = Math.min(100, player.flameFuel + realDt * 42);
        }

        if (player.vacuumTimer > 0) {
          player.vacuumTimer -= realDt;
          for (const en of enemies) {
            if (!en.hit && en.x > player.x - 10 && en.x < player.x + 245) {
              en.hit = true; runStats.beans += 4;
              player.pouchAmmo = en.shielded ? 'riot_saw' : 'shark_bomb';
              player.vacuumTimer = 0; playSfx('parry');
              syncControlsUI();
              break;
            }
          }
          if (player.vacuumTimer <= 0 && !player.pouchAmmo) {
            player.pouchAmmo = 'fish_spread';
            syncControlsUI();
          }
        }

        if (player.kunai) {
          player.kunai.life -= realDt;
          if (!player.kunai.stuck) {
            player.kunai.x += player.kunai.vx * dt;
            player.kunai.y += player.kunai.vy * dt;
            player.kunai.vy += 260 * dt;
            for (const en of enemies) {
              if (!en.hit && Math.hypot(player.kunai.x - en.x, player.kunai.y - (getEnemyWorldY(en) - 24)) < 40) {
                en.shielded = false; defeatEnemy(en);
              }
            }
            if (activeBoss && !player.kunai.hitBossOnce && Math.hypot(player.kunai.x - activeBoss.worldX, player.kunai.y - (getBaseSurfaceY(activeBoss.worldX) - 54 + activeBoss.yOff)) < 68) {
              player.kunai.hitBossOnce = true;
              player.kunai.stuck = true;
              hitBoss(5.5, false, false);
            } else if (player.kunai.x > player.x + 255) {
              player.kunai.stuck = true;
            }
          }
          if (player.kunai.life <= 0) {
            player.kunai = null;
            syncControlsUI();
          }
        }

        // ==================== PROGRESSIVE SPEED SCALING ("跑得越远速度越快!") ====================
        let inMud = false;
        let onIce = false;
        if (player.onGround && !player.mountId && player.giantTimer <= 0 && superBonusTimer <= 0) {
          for (const mz of mudZones) {
            if (!mz.dried && player.x > mz.x && player.x < mz.x + mz.len) { inMud = true; break; }
          }
          for (const iz of iceZones) {
            if (player.x > iz.x && player.x < iz.x + iz.len) { onIce = true; break; }
          }
        }

        // Genuine Progressive Speed Curve: 320 -> 450 -> 580 -> 660 px/s as distance grows!
        const distAccel = Math.min(340, runStats.dist * 0.19);
        let desiredVx = player.baseSpeed + distAccel;
        if (headStartTargetDist > 0) {
          desiredVx = 1380; // Supersonic Pre-Run / Quick Head-Start Rocket!
        } else if (player.rocketDashTimer > 0) {
          desiredVx = Math.max(desiredVx * 1.45, 880);
        } else if (superBonusTimer > 0) {
          desiredVx = Math.max(desiredVx * 1.2, 480);
        } else if (player.boostTimer > 0 || player.giantTimer > 0 || onIce) {
          desiredVx *= onIce ? 1.28 : 1.22;
        } else if (inMud) {
          desiredVx *= 0.7;
        }
        player.vx += (desiredVx - player.vx) * Math.min(1, dt * 8);

        // Supersonic Head-Start Flight Path!
        if (headStartTargetDist > 0) {
          player.x += player.vx * dt;
          const flyY = getBaseSurfaceY(player.x) - 115;
          player.y += (flyY - player.y) * Math.min(1, dt * 10);
          player.vy = 0; player.onGround = false; player.angle = -0.06;
          flamePuffs.push({ x: player.x - 45, y: player.y - 34, vx: player.vx * 0.2, vy: (Math.random() - 0.5) * 80, r: 16, life: 0.25, maxLife: 0.25 });

          // Smash nearby enemies into flying beans during Head-Start!
          for (const en of enemies) {
            if (!en.hit && Math.abs(en.x - player.x) < 150) defeatEnemy(en);
          }
          if (runStats.dist >= headStartTargetDist) {
            headStartTargetDist = 0;
            player.invulnTimer = 1.6;
            shockwaves.push({ x: player.x, y: player.y, r: 20, maxR: 360, life: 0.4, color: '#fde047', harmless: false });
            playSfx('crater');
            showToast('🏁 冲刺结束 · 全速开跑!');
            refreshBuffChips();
          }
        } else if (player.rocketDashTimer > 0) {
          player.x += player.vx * dt;
          const flyY = (superBonusTimer > 0 ? -290 : getBaseSurfaceY(player.x) - 95);
          player.y += (flyY - player.y) * Math.min(1, dt * 10);
          player.vy = 0; player.onGround = false; player.angle = -0.05;
          flamePuffs.push({ x: player.x - 45, y: player.y - 34, vx: player.vx * 0.2, vy: 0, r: 14, life: 0.22, maxLife: 0.22 });
        } else if (player.ropeTimer > 0 && player.ropeAnchor) {
          player.ropeTimer -= realDt;
          const ax = player.ropeAnchor.x, ay = player.ropeAnchor.y;
          player.x += player.vx * 1.38 * dt;
          const dx = player.x - ax;
          const targetY = ay + Math.sqrt(Math.max(400, player.ropeLen * player.ropeLen - Math.min(player.ropeLen * 0.92, Math.abs(dx)) ** 2));
          player.y += (targetY - player.y) * Math.min(1, dt * 12);
          player.vy = -260;
          if (player.ropeTimer <= 0) { player.ropeAnchor = null; player.vy = -380; }
        } else {
          player.x += player.vx * dt;
        }

        runStats.dist = Math.floor((player.x - 120) / 18);
        const curStageIdx = Math.floor(runStats.dist / STAGE_SPAN_M) % STAGES.length;
        if (curStageIdx !== stageIndex && superBonusTimer <= 0) {
          prevStageIndex = stageIndex;
          stageFadeTimer = 1.0;
          stageIndex = curStageIdx;
          showToast(STAGES[stageIndex].name);
        }

        // Check 500m Checkpoint Archways -> Permanently Unlock Milestone!
        for (const fl of checkpointFlags) {
          if (!fl.passed && player.x >= fl.x) {
            fl.passed = true;
            if (fl.dist > save.maxCheckpoint) {
              save.maxCheckpoint = fl.dist;
              save.selectedCheckpoint = fl.dist;
            }
            bankRunProgress(true);
            playSfx('crate');
            showToast(`🚩 存档点 ${fl.dist}m 已激活!`);
          }
        }

        if (!activeBoss && superBonusTimer <= 0 && headStartTargetDist <= 0 && runStats.dist >= nextTruckDist) {
          nextTruckDist = runStats.dist + 480;
          const tx = player.x + 430;
          cashTrucks.push({ x: tx, y: getBaseSurfaceY(tx), hp: 6, dead: false, flash: 0 });
          showToast('🚨 装甲运钞车！用技能或踩顶打爆它!');
        }
        if (!activeBoss && superBonusTimer <= 0 && headStartTargetDist <= 0 && runStats.dist >= nextBossDist) {
          spawnStageBoss();
        }

        player.jiggleVel += (-180 * player.jiggle - 10 * player.jiggleVel) * dt;
        player.jiggle += player.jiggleVel * dt;
        player.wheelAngle += (player.vx * dt) / 23;
        player.crankAngle += ((player.vx * dt) / 32) * (h.id === 'naiwa' ? 1.7 : 1.0);

        // Terrain & Rails Physics
        const tState = getTerrainStateAt(player.x);
        const gY = tState.y;
        const gSlope = getTerrainSlope(player.x);

        let matchedRail = null, matchedRailY = 0;
        if (superBonusTimer <= 0 && headStartTargetDist <= 0 && player.rocketDashTimer <= 0 && player.vy >= -65 && player.mountId !== 'biplane') {
          for (const rl of rails) {
            if (player.x >= rl.x && player.x <= rl.x + rl.len) {
              const ry = getBaseSurfaceY(player.x) - rl.hOff;
              if (Math.abs(player.y - ry) < 26) { matchedRail = rl; matchedRailY = ry; break; }
            }
          }
        }
        if (matchedRail) {
          player.y = matchedRailY; player.vy = 0;
          player.onRail = matchedRail; player.onGround = false;
          player.jumpsLeft = getMaxJumps();
          player.angle = gSlope * 0.4;
          if (matchedRail.kind === 'maglev') player.boostTimer = Math.max(player.boostTimer, 0.25);
        } else {
          player.onRail = null;
        }

        if (headStartTargetDist <= 0 && player.rocketDashTimer <= 0 && player.mountId !== 'biplane' && !player.onRail && !(player.ropeTimer > 0 && player.ropeAnchor)) {
          if (player.onGround && tState.isPit) player.onGround = false;
          if (!player.onGround) {
            let grav = 1380;
            if (h.id === 'pelican' && jumpHeld && player.vy > 40) {
              grav = 400; player.vy = Math.min(player.vy, 145);
            } else if (!jumpHeld && player.vy < -170) {
              grav = 2020;
            }
            player.vy += grav * dt;
            player.y += player.vy * dt;

            if (tState.isPit && player.y > tState.baseY + 84) {
              if (player.giantTimer > 0) {
                player.y = tState.baseY; player.vy = -560;
              } else {
                player.x += 55;
                player.y = tState.baseY - 75;
                player.jumpsLeft = getMaxJumps();
                takePlayerDamage(true);
              }
            } else if (!tState.isPit && player.y >= gY) {
              player.y = gY; player.vy = 0;
              player.onGround = true;
              player.jumpsLeft = getMaxJumps();
              player.angle = gSlope;
              player.jiggleVel = 210;
            } else {
              player.angle += (Math.max(-0.42, Math.min(0.42, player.vy * 0.0007)) - player.angle) * dt * 8;
            }
          } else {
            player.y = gY;
            player.coyoteTimer = 0.14;
            player.angle += (gSlope - player.angle) * Math.min(1, dt * 14);
          }
        }

        spawnWorldAhead();

        // ==================== PICK UP JUMP-HEIGHT 3D PROPS (Comfortable Jump Reach — NO Flat-Ground AFK Magnet!) ====================
        const clawLv = save.mods.claw || 0;
        const propTouchR = player.giantTimer > 0 ? 84 : 58;

        for (const wp of worldProps) {
          if (wp.taken) continue;
          wp.phase += dt * 3.4;
          wp.y = wp.baseY + Math.sin(wp.phase) * 9;
          const d = Math.hypot(wp.x - player.x, wp.y - (player.y - 48));
          if (d < propTouchR) {
            wp.taken = true;
            activateWorldProp(wp.def, wp.x, wp.y);
          }
        }

        if (superBonusTimer <= 0) {
          for (const ct of cashTrucks) {
            if (ct.dead) continue;
            if (ct.flash > 0) ct.flash -= realDt;
            ct.x += (player.vx * 0.72) * dt;
            ct.y = getBaseSurfaceY(ct.x);
            if (Math.abs(ct.x - player.x) < 64 && Math.abs((ct.y - 26) - (player.y - 32)) < 50) {
              if (player.giantTimer > 0 || player.mountId === 'monster_truck' || player.rocketDashTimer > 0 || headStartTargetDist > 0) {
                hitCashTruck(ct, 10);
              } else if (player.vy > 35 && player.y < ct.y - 22) {
                player.vy = -570;
                player.onGround = false;
                player.jumpsLeft = getMaxJumps();
                hitCashTruck(ct, 3);
                addPopup('👟 踩顶破甲!', ct.x, ct.y - 68, '#4ade80');
              } else {
                // Harmless Armored Bumper Nudge (Zero cheap HP loss, zero AFK freebie — attack or stomp to break!)
                ct.x = player.x + 88;
                player.vx = Math.min(player.vx, 250);
                if (!ct.nudgeCd || ct.nudgeCd <= 0) {
                  ct.nudgeCd = 1.2;
                  playSfx('bean');
                  addPopup('💥 按技能或踩顶爆金币!', ct.x, ct.y - 68, '#fde047');
                }
              }
            }
            if (ct.nudgeCd > 0) ct.nudgeCd -= realDt;
          }

          for (const cp of catapults) {
            if (cp.anim > 0) cp.anim = Math.max(0, cp.anim - dt * 3);
            const cy = getBaseSurfaceY(cp.x);
            if (Math.abs(player.x - cp.x) < 44 && Math.abs(player.y - cy) < 34 && player.vy >= -60) {
              cp.anim = 1.0; player.vy = -700; player.onGround = false; player.jumpsLeft = getMaxJumps();
              playSfx('jump');
            }
          }

          for (const lp of lilyPads) {
            if (lp.anim > 0) lp.anim = Math.max(0, lp.anim - dt * 3.5);
            const ly = getBaseSurfaceY(lp.x) - lp.yOff;
            if (Math.abs(player.x - lp.x) < 44 && Math.abs(player.y - ly) < 34 && player.vy >= -40) {
              lp.anim = 1.0; player.vy = -720; player.onGround = false; player.jumpsLeft = getMaxJumps();
              playSfx('jump');
            }
          }

          for (const gy of geysers) {
            gy.phase += dt * 2.6;
            const base = getBaseSurfaceY(gy.x);
            if (Math.sin(gy.phase) > -0.25 && Math.abs(player.x - gy.x) < 44 && player.y <= base + 15 && player.y >= base - 190) {
              player.vy = -660; player.onGround = false; player.jumpsLeft = getMaxJumps(); playSfx('jump');
            }
          }

          for (const bb of backboards) {
            if (!bb.triggered && Math.hypot(player.x - bb.x, (player.y - 45) - bb.y) < 65) {
              checkEnvironmentImpactArea(bb.x, bb.y, 30);
            }
          }

          for (const hg of hangers) {
            if (hg.fallen) {
              const groundY = getBaseSurfaceY(hg.x) - 22;
              if (hg.boardY < groundY) {
                hg.fallVy += 1500 * dt; hg.boardY += hg.fallVy * dt;
                if (hg.boardY >= groundY) {
                  hg.boardY = groundY; playSfx('crater'); shakeTime = 0.26; shakeMag = 13;
                  for (const en of enemies) if (!en.hit && Math.abs(en.x - hg.x) < 170) { en.shielded = false; defeatEnemy(en); }
                  if (activeBoss && Math.abs(activeBoss.worldX - hg.x) < 205) hitBoss(10, true, false);
                }
              }
            }
          }

          for (const lg of laserGates) {
            if (Math.abs(player.x - lg.x) < 28 && player.y > getBaseSurfaceY(lg.x) - 135) {
              if (lg.hacked || player.giantTimer > 0 || player.rocketDashTimer > 0 || headStartTargetDist > 0) {
                if (!lg.passed) { lg.passed = true; lg.hacked = true; player.boostTimer = 1.6; runStats.beans += 6; playSfx('crate'); }
              } else {
                lg.hacked = true;
                takePlayerDamage(false);
              }
            }
          }

          // Alpine Rolling Snowballs!
          for (const sb of snowballs) {
            if (sb.smashed) continue;
            sb.x += sb.vx * dt;
            sb.y = getBaseSurfaceY(sb.x) - 28;
            sb.rot -= 7 * dt;
            if (Math.abs(sb.x - player.x) < 42 && Math.abs(sb.y - (player.y - 26)) < 44) {
              if (player.giantTimer > 0 || player.mountId === 'monster_truck' || player.rocketDashTimer > 0 || headStartTargetDist > 0) {
                sb.smashed = true;
                playSfx('crater');
                spawnBeanFountain(sb.x, sb.y, 7, 3);
              } else if (player.vy > 45 && player.y < sb.y - 6) {
                sb.smashed = true;
                player.vy = -580;
                playSfx('crater');
                spawnBeanFountain(sb.x, sb.y, 6, 3);
              } else {
                sb.smashed = true;
                takePlayerDamage(false);
              }
            }
          }
        }

        // ==================== SMART HOMING BASKETBALL & PROJECTILES ====================
        function findHomingTarget(px, py) {
          let best = null;
          let bestScore = Infinity;

          // 1. Intercept incoming Lawyer Scrolls / Dunk Meteors!
          for (const sh of enemyShots) {
            if (sh.dead || sh.parried || sh.kind === 'spike_roller' || sh.kind === 'hover_saw') continue;
            const d = Math.hypot(sh.x - px, sh.y - py);
            if (sh.x > px - 35 && d < 320 && d * 0.65 < bestScore) {
              bestScore = d * 0.65;
              best = { x: sh.x, y: sh.y };
            }
          }
          // 2. Live Aerial & Ground Monsters!
          for (const en of enemies) {
            if (en.hit) continue;
            const ey = getEnemyWorldY(en) - 24;
            const dx = en.x - px;
            if (dx < -40 || dx > 640) continue;
            const d = Math.hypot(dx, ey - py);
            if (d < bestScore) { bestScore = d; best = { x: en.x, y: ey }; }
          }
          // 3. Active Boss!
          if (activeBoss && superBonusTimer <= 0) {
            const by = getBaseSurfaceY(activeBoss.worldX) - 54 + activeBoss.yOff;
            const dx = activeBoss.worldX - px;
            if (dx > -40 && dx < 680) {
              const d = Math.hypot(dx, by - py) * 0.9;
              if (d < bestScore) { bestScore = d; best = { x: activeBoss.worldX, y: by }; }
            }
          }
          // 4. Rolling Snowballs, Cash Trucks, Backboards & Bells!
          for (const sb of snowballs) {
            if (!sb.smashed && sb.x > px - 20 && sb.x < px + 520) {
              const d = Math.hypot(sb.x - px, sb.y - py);
              if (d < bestScore) { bestScore = d; best = { x: sb.x, y: sb.y }; }
            }
          }
          for (const ct of cashTrucks) {
            if (!ct.dead && ct.x > px - 20 && ct.x < px + 560) {
              const d = Math.hypot(ct.x - px, (ct.y - 24) - py);
              if (d < bestScore) { bestScore = d; best = { x: ct.x, y: ct.y - 24 }; }
            }
          }
          for (const bb of backboards) {
            if (!bb.triggered && bb.x > px && bb.x < px + 480) {
              const d = Math.hypot(bb.x - px, bb.y - py) * 1.1;
              if (d < bestScore) { bestScore = d; best = { x: bb.x, y: bb.y }; }
            }
          }
          for (const bl of bells) {
            if (bl.rungTimer <= 0 && bl.x > px && bl.x < px + 480) {
              const d = Math.hypot(bl.x - px, bl.y - py) * 1.1;
              if (d < bestScore) { bestScore = d; best = { x: bl.x, y: bl.y }; }
            }
          }
          return best;
        }

        for (const pr of projectiles) {
          if (pr.kind === 'ikun_pinball') {
            if (!pr.trail) pr.trail = [];
            pr.trail.push({ x: pr.x, y: pr.y });
            if (pr.trail.length > 9) pr.trail.shift();

            // Active Proportional-Navigation Homing Steering!
            const lockT = findHomingTarget(pr.x, pr.y);
            pr.lockPos = lockT;
            if (lockT) {
              const wantA = Math.atan2(lockT.y - pr.y, lockT.x - pr.x);
              const curA = Math.atan2(pr.vy, pr.vx);
              let diff = wantA - curA;
              while (diff > Math.PI) diff -= Math.PI * 2;
              while (diff < -Math.PI) diff += Math.PI * 2;
              const maxTurn = 16.5 * dt;
              const nextA = curA + Math.max(-maxTurn, Math.min(maxTurn, diff));
              const spd = Math.max(850, player.vx + 650);
              pr.vx = Math.cos(nextA) * spd;
              pr.vy = Math.sin(nextA) * spd;
            } else {
              const floorY = (superBonusTimer > 0 ? -220 : getBaseSurfaceY(pr.x)) - pr.r;
              if (pr.y > floorY) { pr.y = floorY; pr.vy = -Math.abs(pr.vy) - 180; }
            }

            pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.rot += 18 * dt; pr.life -= dt;
            checkEnvironmentImpactArea(pr.x, pr.y, pr.r + 24);

            // Intercept Lawyer Scrolls / Dunk Meteors mid-air!
            for (const sh of enemyShots) {
              if (!sh.dead && !sh.parried && sh.kind !== 'spike_roller' && sh.kind !== 'hover_saw' && Math.hypot(pr.x - sh.x, pr.y - sh.y) < pr.r + 28) {
                sh.parried = true; sh.vx = player.vx + 920; sh.vy = -50;
                playSfx('parry');
                addPopup('篮球盖帽!', sh.x, sh.y - 30, '#fde047');
              }
            }
            for (const sb of snowballs) {
              if (!sb.smashed && Math.hypot(pr.x - sb.x, pr.y - sb.y) < pr.r + 34) {
                sb.smashed = true;
                playSfx('crater');
                spawnBeanFountain(sb.x, sb.y, 6, 3);
                pr.bouncesLeft -= 1;
                if (pr.bouncesLeft <= 0) pr.life = 0;
              }
            }
            for (const ct of cashTrucks) {
              if (!ct.dead && Math.hypot(pr.x - ct.x, pr.y - (ct.y - 20)) < 55) {
                hitCashTruck(ct, 1);
                pr.bouncesLeft -= 1;
                if (pr.bouncesLeft <= 0) pr.life = 0;
                else pr.vy = -260;
                break;
              }
            }
            for (const en of enemies) {
              if (en.hit || pr.life <= 0) continue;
              const ey = getEnemyWorldY(en) - 24;
              if (Math.hypot(pr.x - en.x, pr.y - ey) < pr.r + 34) {
                en.shielded = false; defeatEnemy(en);
                pr.bouncesLeft -= 1;
                if (pr.bouncesLeft <= 0) { pr.life = 0; break; }
                const nextT = findHomingTarget(pr.x + 8, pr.y);
                if (nextT) {
                  const a = Math.atan2(nextT.y - pr.y, nextT.x - pr.x);
                  const spd = Math.max(860, player.vx + 660);
                  pr.vx = Math.cos(a) * spd; pr.vy = Math.sin(a) * spd;
                } else pr.vy = -220;
                break;
              }
            }
          } else if (pr.kind === 'riot_saw') {
            pr.x += pr.vx * dt; pr.y = getBaseSurfaceY(pr.x) - pr.r; pr.rot += 20 * dt; pr.life -= dt;
            checkEnvironmentImpactArea(pr.x, pr.y, pr.r + 26);
            for (const en of enemies) if (!en.hit && Math.abs(pr.x - en.x) < pr.r + 32) { en.shielded = false; defeatEnemy(en); }
          } else {
            pr.vy += 1050 * dt; pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.rot += 12 * dt; pr.life -= dt;
            checkEnvironmentImpactArea(pr.x, pr.y, pr.r + 28);
            for (const ct of cashTrucks) {
              if (!ct.dead && Math.hypot(pr.x - ct.x, pr.y - (ct.y - 20)) < 58) { hitCashTruck(ct, 3); pr.life = 0; }
            }
            const gy = (superBonusTimer > 0 ? -220 : getBaseSurfaceY(pr.x)) - pr.r;
            if (pr.y >= gy && pr.life > 0) {
              pr.y = gy; playSfx('crater');
              shockwaves.push({ x: pr.x, y: gy + pr.r, r: 14, maxR: 180, life: 0.26, color: '#f97316', harmless: false });
              if (pr.bouncesLeft && pr.bouncesLeft > 0) { pr.bouncesLeft -= 1; pr.vy = -410; }
              else pr.life = 0;
            }
            for (const en of enemies) {
              if (!en.hit && Math.hypot(pr.x - en.x, pr.y - (getEnemyWorldY(en) - 24)) < pr.r + 34) {
                en.shielded = false; defeatEnemy(en);
                if (pr.kind === 'fish_shot') pr.life = 0;
              }
            }
          }
          if (activeBoss && pr.life > 0 && Math.hypot(pr.x - activeBoss.worldX, pr.y - (getBaseSurfaceY(activeBoss.worldX) - 54 + activeBoss.yOff)) < pr.r + 56) {
            pr.bouncesLeft = 0;
            pr.life = 0;
            if (pr.kind === 'ikun_pinball') hitBoss(5.2, false, false);
            else if (pr.kind === 'bowling_mob') hitBoss(11.0, true, false);
            else if (pr.kind === 'shark_bomb') hitBoss(8.5, true, false);
            else if (pr.kind === 'riot_saw') hitBoss(8.0, false, false);
            else hitBoss(4.2, false, false);
          }
        }
        projectiles = projectiles.filter((p) => p.life > 0);

        for (const sw of shockwaves) {
          sw.r += (sw.maxR - sw.r) * dt * 11; sw.life -= realDt;
          if (!sw.harmless) {
            for (const en of enemies) if (!en.hit && Math.abs(en.x - sw.x) < sw.r) { en.shielded = false; defeatEnemy(en); }
          }
        }
        shockwaves = shockwaves.filter((s) => s.life > 0);

        // ==================== 4-TIER MULTI-SKILL BOSS AI & HAZARDS ====================
        const cam = getCamera();
        let parryGlow = false;

        if (activeBoss && superBonusTimer <= 0) {
          activeBoss.dmgBudget = Math.min(activeBoss.maxBudget, activeBoss.dmgBudget + activeBoss.dmgRate * dt);
          if (activeBoss.counterCd > 0) activeBoss.counterCd = Math.max(0, activeBoss.counterCd - dt);
          if (activeBoss.flashTimer > 0) activeBoss.flashTimer -= realDt;

          const baseBX = cam.camX + (W * 0.79) / cam.worldScale;

          if (activeBoss.chargePhase === 'windup') {
            activeBoss.worldX += ((baseBX + 48) - activeBoss.worldX) * Math.min(1, dt * 7);
            activeBoss.yOff = -6 + Math.sin(performance.now() * 0.04) * 5;
            activeBoss.chargeTimer -= dt;
            if (activeBoss.chargeTimer < 0.30) parryGlow = true;
            if (activeBoss.chargeTimer <= 0) {
              activeBoss.chargePhase = 'dashing';
              activeBoss.chargeTimer = 1.25;
              playSfx('crater');
            }
          } else if (activeBoss.chargePhase === 'dashing') {
            parryGlow = Math.abs(activeBoss.worldX - player.x) < 205;
            const dashSpd = activeBoss.phase >= 2 ? 620 : 530;
            activeBoss.worldX += (player.vx - dashSpd) * dt;
            activeBoss.yOff = 0;
            activeBoss.chargeTimer -= dt;
            if (Math.random() < 0.7) {
              flamePuffs.push({ x: activeBoss.worldX + 35, y: getBaseSurfaceY(activeBoss.worldX) - 24, vx: player.vx * 0.3, vy: -35, r: 15, life: 0.28, maxLife: 0.28 });
            }
            const by = getBaseSurfaceY(activeBoss.worldX);
            if (Math.abs(activeBoss.worldX - player.x) < 62 && player.y < by - 46 && player.vy > 10) {
              // Stomp Counterplay on Charging Boss!
              player.vy = -590;
              player.onGround = false;
              player.jumpsLeft = getMaxJumps();
              activeBoss.chargePhase = null;
              activeBoss.worldX = player.x + 305;
              playSfx('parry');
              addPopup('👟 踏头踩击!!', player.x, player.y - 88, '#4ade80', 20);
              hitBoss(14, true, true);
            } else if (Math.abs(activeBoss.worldX - player.x) < 52 && Math.abs((by - 38) - (player.y - 36)) < 50) {
              activeBoss.chargePhase = null;
              activeBoss.worldX = player.x + 290;
              takePlayerDamage(false);
            } else if (activeBoss.worldX < player.x - 135 || activeBoss.chargeTimer <= 0) {
              activeBoss.chargePhase = null;
              activeBoss.worldX = cam.camX + (W * 0.88) / cam.worldScale;
            }
          } else if (activeBoss.slamPhase === 'rising') {
            activeBoss.worldX += (baseBX - activeBoss.worldX) * Math.min(1, dt * 8);
            activeBoss.slamTimer -= dt;
            const p = Math.min(1, (0.58 - activeBoss.slamTimer) / 0.58);
            activeBoss.yOff = -175 * Math.sin(p * Math.PI * 0.5);
            if (activeBoss.slamTimer <= 0) {
              activeBoss.slamPhase = 'falling';
              activeBoss.slamTimer = 0.16;
            }
          } else if (activeBoss.slamPhase === 'falling') {
            activeBoss.slamTimer -= dt;
            activeBoss.yOff = Math.min(0, activeBoss.yOff + 1250 * dt);
            if (activeBoss.slamTimer <= 0) {
              activeBoss.slamPhase = null;
              activeBoss.yOff = 0;
              const bx = activeBoss.worldX, by = getBaseSurfaceY(bx);
              shakeTime = 0.30; shakeMag = 14; playSfx('crater');
              shockwaves.push({ x: bx, y: by - 12, r: 16, maxR: 250, life: 0.34, color: '#fde047', harmless: true });
              enemyShots.push({ kind: 'spike_roller', x: bx - 32, y: by, vx: player.vx - (activeBoss.phase >= 2 ? 260 : 215), parried: false, rot: 0 });
              const guardCnt = activeBoss.phase >= 2 ? 2 : 1;
              for (let g = 0; g < guardCnt; g++) {
                enemies.push({ x: bx - 75 - g * 65, kind: g === 0 ? 'boar_frog' : 'dribbler', hit: false, phase: g });
              }
              activeBoss.actionTimer = activeBoss.phase >= 2 ? 1.45 : 1.85;
            }
          } else {
            activeBoss.worldX += (baseBX - activeBoss.worldX) * Math.min(1, dt * 8);
            if (activeBoss.stunTimer > 0) {
              activeBoss.stunTimer -= dt;
              activeBoss.yOff = 10;
            } else if (activeBoss.windupKind) {
              activeBoss.windupTimer -= dt;
              activeBoss.yOff = -20 * Math.sin(((activeBoss.windupMax - activeBoss.windupTimer) / activeBoss.windupMax) * Math.PI);
              if (activeBoss.windupTimer <= 0) {
                const bx = activeBoss.worldX, by = getBaseSurfaceY(bx);
                const ph = activeBoss.phase || 1;
                const wk = activeBoss.windupKind;

                if (wk === 'scroll_fan') {
                  enemyShots.push({ kind: 'lawyer_orb', x: bx - 34, y: by - 40, targetH: 40, vx: player.vx - 210, parried: false, rot: 0 });
                  enemyShots.push({ kind: 'lawyer_orb', x: bx + 95, y: by - 108, targetH: 108, vx: player.vx - 215, parried: false, rot: 0 });
                  if (ph >= 2) {
                    enemyShots.push({ kind: 'lawyer_orb', x: bx + 215, y: by - 52, targetH: 52, vx: player.vx - 225, parried: false, rot: 0 });
                  }
                } else if (wk === 'ground_eruption') {
                  const cnt = ph >= 3 ? 4 : (ph === 2 || activeBoss.kind === 'lava_dragon' ? 3 : 2);
                  const col = activeBoss.kind === 'lava_dragon' ? '#f97316' : '#84cc16';
                  for (let k = 0; k < cnt; k++) {
                    bossHazards.push({
                      kind: 'ground_eruption', relX: 85 + k * 105, worldX: player.x + 85 + k * 105,
                      locked: false, delay: k * 0.16, warn: 0.74, maxWarn: 0.74, fire: 0.34, color: col, hitDone: false
                    });
                  }
                } else if (wk === 'bball_barrage') {
                  const cnt = ph >= 2 ? 3 : 2;
                  for (let k = 0; k < cnt; k++) {
                    enemyShots.push({
                      kind: 'bounce_bball',
                      x: bx - 28 + k * 75, y: by - 115 - k * 24,
                      vx: player.vx - (195 + k * 28), vy: -240 - k * 55,
                      parried: false, rot: 0
                    });
                  }
                  if (activeBoss.kind === 'lava_dragon') {
                    enemyShots.push({ kind: 'spike_roller', x: bx - 25, y: by, vx: player.vx - 225, parried: false, rot: 0 });
                  }
                } else if (wk === 'laser_sweep') {
                  const firstH = Math.random() < 0.6 ? 30 : 108;
                  const beamCol = activeBoss.kind === 'lava_dragon' ? '#fb923c' : (activeBoss.kind === 'demon_hakimi' ? '#38bdf8' : '#f43f5e');
                  bossHazards.push({ kind: 'laser_sweep', hOff: firstH, delay: 0, warn: 0.72, maxWarn: 0.72, fire: 0.32, color: beamCol, hitDone: false });
                  if (ph >= 2) {
                    const secondH = firstH < 60 ? 110 : 30;
                    bossHazards.push({ kind: 'laser_sweep', hOff: secondH, delay: 0.56, warn: 0.66, maxWarn: 0.66, fire: 0.30, color: beamCol, hitDone: false });
                  }
                  if (activeBoss.kind === 'lava_dragon') {
                    enemyShots.push({ kind: 'dunk_meteor', x: bx - 30, y: by - 62, targetH: 58, vx: player.vx - 205, parried: false, rot: 0 });
                  }
                } else if (wk === 'twin_saws') {
                  enemyShots.push({ kind: 'spike_roller', x: bx - 30, y: by, vx: player.vx - 230, parried: false, rot: 0 });
                  enemyShots.push({ kind: 'hover_saw', x: bx + 85, y: by - 122, hOff: 122, vx: player.vx - 240, parried: false, rot: 0 });
                  if (ph >= 3) {
                    enemyShots.push({ kind: 'spike_roller', x: bx + 220, y: by, vx: player.vx - 245, parried: false, rot: 0 });
                  }
                } else if (wk === 'air_strike') {
                  const cnt = ph >= 3 ? 4 : 3;
                  for (let k = 0; k < cnt; k++) {
                    bossHazards.push({
                      kind: 'air_strike', relX: 70 + k * 100, worldX: player.x + 70 + k * 100,
                      locked: false, delay: k * 0.15, warn: 0.76, maxWarn: 0.76, fire: 0.32, color: '#ef4444', hitDone: false
                    });
                  }
                  spawnAerialDronePair(bx - 40, ph >= 2 ? 2 : 1);
                } else if (wk === 'blink_volley') {
                  player.slashLines.push({ x1: bx, y1: by - 20, x2: bx - 25, y2: by - 140, timer: 0.35 });
                  activeBoss.yOff = -85;
                  for (let k = 0; k < 3; k++) {
                    const th = k === 1 ? 105 : 44;
                    enemyShots.push({ kind: k === 2 ? 'bounce_bball' : 'lawyer_orb', x: bx - 30 + k * 90, y: by - th, targetH: th, vx: player.vx - 220, vy: -220, parried: false, rot: 0 });
                  }
                }

                activeBoss.windupKind = null;
                activeBoss.actionTimer = ph >= 3 ? 1.25 : (ph === 2 ? 1.50 : 1.85);
              }
            } else {
              activeBoss.yOff = Math.sin(performance.now() * 0.006) * 12;
              activeBoss.actionTimer -= dt;
              if (activeBoss.actionTimer <= 0) {
                const ph = activeBoss.phase || 1;
                const idx = activeBoss.skillIdx++;
                if (activeBoss.kind === 'titan_naiwa') {
                  const kit = ['sky_slam', 'scroll_fan', 'ground_eruption'];
                  const pick = kit[idx % kit.length];
                  if (pick === 'sky_slam') {
                    activeBoss.slamPhase = 'rising'; activeBoss.slamTimer = 0.58;
                    addPopup('🐸 马桶泰山压顶!', activeBoss.worldX - 40, getBaseSurfaceY(activeBoss.worldX) - 110, '#a3e635');
                  } else {
                    activeBoss.windupKind = pick;
                    activeBoss.windupMax = 0.62; activeBoss.windupTimer = 0.62;
                    if (pick === 'ground_eruption') addPopup('🧪 黄金毒泉!', activeBoss.worldX - 35, getBaseSurfaceY(activeBoss.worldX) - 105, '#a3e635');
                  }
                } else if (activeBoss.kind === 'kun_mecha') {
                  const kit = ['bball_barrage', 'laser_sweep', 'dash_charge'];
                  const pick = kit[idx % kit.length];
                  if (pick === 'dash_charge') {
                    activeBoss.chargePhase = 'windup'; activeBoss.chargeTimer = 0.68;
                    addPopup('🐔 霸体铁山冲撞!', activeBoss.worldX - 45, getBaseSurfaceY(activeBoss.worldX) - 110, '#fde047');
                  } else {
                    activeBoss.windupKind = pick;
                    activeBoss.windupMax = 0.60; activeBoss.windupTimer = 0.60;
                    addPopup(pick === 'laser_sweep' ? '⚡ 背带离子光束!' : '🏀 烈焰暴扣雨!', activeBoss.worldX - 40, getBaseSurfaceY(activeBoss.worldX) - 110, '#fb923c');
                  }
                } else if (activeBoss.kind === 'demon_hakimi') {
                  const kit = ph >= 2 ? ['twin_saws', 'air_strike', 'blink_volley', 'turbo_combo'] : ['twin_saws', 'air_strike', 'blink_volley'];
                  const pick = kit[idx % kit.length];
                  if (pick === 'turbo_combo') {
                    bossHazards.push({ kind: 'laser_sweep', hOff: 30, delay: 0, warn: 0.65, maxWarn: 0.65, fire: 0.28, color: '#38bdf8', hitDone: false });
                    activeBoss.chargePhase = 'windup'; activeBoss.chargeTimer = 0.85;
                    addPopup('⚡ 涡轮光束+极速冲撞!', activeBoss.worldX - 50, getBaseSurfaceY(activeBoss.worldX) - 115, '#38bdf8');
                  } else {
                    activeBoss.windupKind = pick;
                    activeBoss.windupMax = 0.56; activeBoss.windupTimer = 0.56;
                    addPopup(pick === 'air_strike' ? '🚀 曼波导弹锁定!' : (pick === 'twin_saws' ? '⚙️ 天地双涡轮!' : '⚡ 幻影连射!'), activeBoss.worldX - 40, getBaseSurfaceY(activeBoss.worldX) - 110, '#c084fc');
                  }
                } else {
                  const kit = ph >= 2
                    ? ['ground_eruption', 'laser_sweep', 'bball_barrage', 'dash_charge', 'cataclysm']
                    : ['ground_eruption', 'laser_sweep', 'bball_barrage', 'dash_charge'];
                  const pick = kit[idx % kit.length];
                  if (pick === 'dash_charge') {
                    activeBoss.chargePhase = 'windup'; activeBoss.chargeTimer = 0.64;
                    addPopup('🐉 灭世暴龙冲锋!', activeBoss.worldX - 45, getBaseSurfaceY(activeBoss.worldX) - 115, '#f97316');
                  } else if (pick === 'cataclysm') {
                    activeBoss.slamPhase = 'rising'; activeBoss.slamTimer = 0.55;
                    for (let k = 0; k < 2; k++) {
                      bossHazards.push({
                        kind: 'air_strike', relX: 95 + k * 115, worldX: player.x + 95 + k * 115,
                        locked: false, delay: 0.2 + k * 0.16, warn: 0.74, maxWarn: 0.74, fire: 0.32, color: '#f97316', hitDone: false
                      });
                    }
                    addPopup('☄️ 天崩红莲灭世!!', activeBoss.worldX - 50, getBaseSurfaceY(activeBoss.worldX) - 115, '#ef4444');
                  } else {
                    activeBoss.windupKind = pick;
                    activeBoss.windupMax = 0.56; activeBoss.windupTimer = 0.56;
                    addPopup(pick === 'laser_sweep' ? '🔥 红莲双龙息!' : (pick === 'ground_eruption' ? '🌋 熔岩火柱!' : '☄️ 火山陨石雨!'), activeBoss.worldX - 45, getBaseSurfaceY(activeBoss.worldX) - 115, '#fb923c');
                  }
                }
              }
            }
          }
        }

        // Update Telegraphed Boss Arena Hazards (Lasers, Magma/Poison Geysers, Radar Air-Strikes!)
        if (superBonusTimer <= 0) {
          for (const hz of bossHazards) {
            if (hz.delay > 0) { hz.delay -= dt; continue; }
            if (hz.warn > 0) {
              hz.warn -= dt;
              if (hz.kind !== 'laser_sweep' && !hz.locked) {
                if (hz.warn > 0.30) hz.worldX = player.x + hz.relX;
                else hz.locked = true;
              }
              if (hz.warn <= 0) playSfx('slash');
            } else if (hz.fire > 0) {
              hz.fire -= dt;
              if (!hz.hitDone && player.giantTimer <= 0) {
                if (hz.kind === 'laser_sweep') {
                  const beamY = getBaseSurfaceY(player.x) - hz.hOff;
                  if (Math.abs((player.y - 36) - beamY) < 25) {
                    hz.hitDone = true;
                    takePlayerDamage(false);
                  }
                } else {
                  const gY = getBaseSurfaceY(hz.worldX);
                  if (Math.abs(player.x - hz.worldX) < 33 && player.y > gY - 135) {
                    hz.hitDone = true;
                    takePlayerDamage(false);
                  }
                }
              }
            }
          }
          bossHazards = bossHazards.filter((hz) => hz.delay > 0 || hz.warn > 0 || hz.fire > 0);
        }

        if (superBonusTimer <= 0) {
          for (const en of enemies) {
            if (en.hit) continue;
            const distAhead = en.x - player.x;
            if (en.kind === 'boar_frog' && distAhead < 430 && distAhead > -50) {
              en.x -= 140 * dt;
            }
            if (en.kind === 'shield_lawyer' && !en.shotDone && distAhead < 450 && distAhead > 210) {
              en.windupTimer = (en.windupTimer || 0.6) - dt;
              if (en.windupTimer <= 0) {
                en.shotDone = true;
                enemyShots.push({ kind: 'lawyer_orb', x: en.x - 22, y: getBaseSurfaceY(en.x) - 42, targetH: 44, vx: player.vx - 185, parried: false, rot: 0 });
              }
            }
          }

          for (const sh of enemyShots) {
            if (sh.kind === 'spike_roller') {
              sh.x += sh.vx * dt; sh.y = getBaseSurfaceY(sh.x); sh.rot -= 11 * dt;
              if (Math.abs(sh.x - player.x) < 30 && player.y > sh.y - 34) {
                sh.dead = true;
                if (player.giantTimer <= 0) takePlayerDamage(false);
              }
            } else if (sh.kind === 'hover_saw') {
              sh.x += sh.vx * dt;
              sh.y = getBaseSurfaceY(sh.x) - (sh.hOff || 118);
              sh.rot -= 16 * dt;
              if (Math.hypot(sh.x - player.x, sh.y - (player.y - 40)) < 34) {
                sh.dead = true;
                if (player.giantTimer <= 0) takePlayerDamage(false);
              }
            } else if (sh.kind === 'bounce_bball' && !sh.parried) {
              sh.vy = (sh.vy || 0) + 980 * dt;
              sh.x += sh.vx * dt;
              sh.y += sh.vy * dt;
              sh.rot -= 10 * dt;
              const floorY = getBaseSurfaceY(sh.x) - 22;
              if (sh.y >= floorY) {
                sh.y = floorY;
                sh.vy = -485;
                playSfx('jump');
              }
              const d = Math.hypot(sh.x - (player.x + 28), sh.y - (player.y - 46));
              if (d < 175) parryGlow = true;
              if (d < 33) {
                sh.dead = true;
                if (player.giantTimer > 0) { sh.parried = true; sh.dead = false; }
                else takePlayerDamage(false);
              }
            } else if (!sh.parried) {
              const wantY = getBaseSurfaceY(sh.x) - (sh.targetH || 46);
              sh.y += (wantY - sh.y) * dt * 4.5;
              sh.x += sh.vx * dt;
              sh.rot = Math.sin(performance.now() * 0.012) * 0.16;
              const d = Math.hypot(sh.x - (player.x + 28), sh.y - (player.y - 46));
              if (d < 175) parryGlow = true;
              if (d < 34) {
                sh.dead = true;
                if (player.giantTimer > 0) { sh.parried = true; sh.dead = false; }
                else takePlayerDamage(false);
              }
            } else {
              sh.x += (player.vx + 920) * dt; sh.rot += 20 * dt;
              if (activeBoss && Math.hypot(sh.x - activeBoss.worldX, sh.y - (getBaseSurfaceY(activeBoss.worldX) - 54 + activeBoss.yOff)) < 68) {
                sh.dead = true; hitBoss(12.0, true, true);
              }
              for (const en of enemies) if (!en.hit && Math.abs(sh.x - en.x) < 52) { en.shielded = false; defeatEnemy(en); sh.dead = true; }
            }
          }
          enemyShots = enemyShots.filter((s) => !s.dead && s.x > cam.camX - 120 && s.x < cam.camX + 1650);
        }

        actionBtn.classList.toggle('glow', parryGlow);

        // Bean Collection (Magnet Prop or Super Bonus pulls whole screen!)
        const magR = (player.magnetTimer > 0 || superBonusTimer > 0 || headStartTargetDist > 0)
          ? 560
          : (85 + clawLv * 80 + (player.giantTimer > 0 ? 90 : 0));

        for (const b of beans) {
          if (b.taken) continue;
          if (b.dynamic) {
            b.vy += 920 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
            const gy = getBaseSurfaceY(b.x) - 18;
            if (b.y >= gy) { b.y = gy; b.vy = -Math.abs(b.vy) * 0.45; b.vx *= 0.7; }
          }
          const dx = b.x - player.x, dy = b.y - (player.y - 48);
          const d = Math.hypot(dx, dy);
          if (d < magR) {
            b.x -= (dx / Math.max(1, d)) * 840 * dt;
            b.y -= (dy / Math.max(1, d)) * 840 * dt;
          }
          if (d < (player.giantTimer > 0 ? 75 : 48)) {
            b.taken = true;
            runStats.beans += b.giant ? 10 : b.val;
            addSuperCharge(b.giant ? 0.22 : 0.07);
            playSfx('bean');
          }
        }

        // Player vs Aerial & Ground Enemies (Giant Spicy Mode, Rocket Dash & Monster Truck Kick Everything Flying!)
        if (superBonusTimer <= 0) {
          const hitW = player.giantTimer > 0 ? 68 : 38;
          for (const en of enemies) {
            if (en.hit) continue;
            const ey = getEnemyWorldY(en);
            if (Math.abs(en.x - player.x) < hitW && Math.abs((ey - 22) - (player.y - 34)) < hitW) {
              if (player.giantTimer > 0 || player.mountId === 'monster_truck' || player.rocketDashTimer > 0 || headStartTargetDist > 0) {
                en.shielded = false;
                defeatEnemy(en);
              } else if (en.kind === 'spiky_cat') {
                takePlayerDamage();
              } else if ((player.vy > 35 && player.y < ey - 8) || (en.kind === 'drone' && player.vy > -40 && player.y < ey + 8)) {
                en.shielded = false;
                player.vy = en.kind === 'drone' ? -600 : -555;
                player.jumpsLeft = Math.max(1, player.jumpsLeft);
                defeatEnemy(en);
              } else if (player.heldMob) {
                player.heldMob = null; en.shielded = false; defeatEnemy(en); player.invulnTimer = 0.5;
              } else {
                en.hit = true;
                takePlayerDamage();
              }
            }
          }
        }

        for (const d of flyingDebris) { d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 980 * dt; d.rot += d.vRot * dt; d.life -= realDt; }
        flyingDebris = flyingDebris.filter((d) => d.life > 0);
        for (const p of popups) { p.y += p.vy * realDt; p.life -= realDt; }
        popups = popups.filter((p) => p.life > 0);

        const cut = cam.camX - 260;
        pits = pits.filter((p) => p.x + p.len > cut);
        mudZones = mudZones.filter((m) => m.x + m.len > cut);
        iceZones = iceZones.filter((iz) => iz.x + iz.len > cut);
        snowballs = snowballs.filter((sb) => !sb.smashed && sb.x > cut);
        lilyPads = lilyPads.filter((l) => l.x > cut);
        catapults = catapults.filter((c) => c.x > cut);
        backboards = backboards.filter((b) => b.x > cut);
        barrels = barrels.filter((b) => !b.exploded && b.x > cut);
        hangers = hangers.filter((hg) => hg.x > cut);
        bells = bells.filter((bl) => bl.x > cut);
        geysers = geysers.filter((g) => g.x > cut);
        laserGates = laserGates.filter((l) => l.x > cut);
        rails = rails.filter((r) => r.x + r.len > cut);
        checkpointFlags = checkpointFlags.filter((f) => f.x > cut);
        worldProps = worldProps.filter((w) => !w.taken && w.x > cut);
        cashTrucks = cashTrucks.filter((c) => !c.dead && c.x > cut);
        roadScars = roadScars.filter((s) => s.x > cut);
        beans = beans.filter((b) => !b.taken && b.x > cut);
        enemies = enemies.filter((e) => !e.hit && e.x > cut);

        if (!parryGlow) syncControlsUI();

      }

      // ==================== RENDERING ENGINE (Sculpted Characters, Bosses & Super Bonus Sky!) ====================

      function drawSpaldingWheelOn(c, x, y, r, angle) {
        c.save(); c.translate(x, y); c.rotate(angle);
        const grad = c.createRadialGradient(-r * 0.3, -r * 0.3, 2, 0, 0, r);
        grad.addColorStop(0, '#fdba74'); grad.addColorStop(0.55, '#f97316'); grad.addColorStop(1, '#9a3412');
        c.fillStyle = grad; c.strokeStyle = '#0f172a'; c.lineWidth = 2.5;
        c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill(); c.stroke();
        if (r > 28) {
          c.fillStyle = '#1e293b';
          for (let i = 0; i < 10; i++) {
            const a = (i * Math.PI * 2) / 10;
            c.beginPath(); c.arc(Math.cos(a) * (r + 2), Math.sin(a) * (r + 2), 4, 0, Math.PI * 2); c.fill();
          }
        }
        c.strokeStyle = '#1e293b'; c.lineWidth = 1.8;
        c.beginPath(); c.moveTo(-r, 0); c.lineTo(r, 0); c.moveTo(0, -r); c.lineTo(0, r); c.arc(-r * 0.7, 0, r * 0.7, -0.82, 0.82); c.stroke();
        c.fillStyle = '#fde047'; c.beginPath(); c.arc(0, 0, r * 0.22, 0, Math.PI * 2); c.fill(); c.stroke();
        c.restore();
      }

      // Unified Sculpted Hero + Bike Rig Renderer (Used in BOTH Main Game AND Live Garage Hub Preview!)
      function drawSculptedBikeAndHero(c, heroId, px, py, pAngle, wAngle, cAngle, jig, modsObj, opts = {}) {
        c.save();
        c.translate(px, py);
        c.rotate(pAngle);

        const totalScale = opts.scale || 1;
        if (totalScale !== 1) c.scale(totalScale, totalScale);

        const isMonster = opts.mountId === 'monster_truck';
        const isPlane = opts.mountId === 'biplane';
        const isRocket = opts.rocketDash;
        const wR = isMonster ? 35 : 23;
        const lift = isMonster ? 18 : 0;

        if (isRocket) {
          // Giant Starlight Dragon Booster Rocket strapped to Bike!
          drawModelOn(c, 'prop_rocket', -10, -45, 0.45, 2.2);
        }

        if (isPlane) {
          c.save(); c.translate(0, -36);
          c.fillStyle = '#ef4444'; c.strokeStyle = '#0f172a'; c.lineWidth = 2.6;
          c.beginPath(); c.roundRect(-55, -12, 112, 26, 10); c.fill(); c.stroke();
          c.fillStyle = '#fde047';
          c.beginPath(); c.roundRect(-24, -34, 58, 9, 4); c.roundRect(-24, 12, 58, 9, 4); c.fill(); c.stroke();
          const propH = 6 + Math.abs(Math.sin(performance.now() * 0.04)) * 24;
          c.fillStyle = '#cbd5e1'; c.beginPath(); c.ellipse(60, 0, 4, propH, 0, 0, Math.PI * 2); c.fill(); c.stroke();
          c.restore();
        }

        const rearX = -38, rearY = -wR;
        const frontX = 40, frontY = -wR;
        const bbX = -4, bbY = -24 - lift;
        const seatX = -21, seatY = -55 - lift;
        const headTopX = 25, headTopY = -58 - lift;
        const headBotX = 28, headBotY = -46 - lift;
        const handleX = 18, handleY = -70 - lift;

        const lp = { x: bbX + Math.cos(cAngle + Math.PI) * 12, y: bbY + Math.sin(cAngle + Math.PI) * 12 };
        const rp = { x: bbX + Math.cos(cAngle) * 12, y: bbY + Math.sin(cAngle) * 12 };
        const hipX = -16, hipY = -58 - lift + jig * 0.2;
        const bendDir = heroId === 'pelican' ? 1 : -1;

        // Far Leg
        const farLeg = solveIK(hipX, hipY, lp.x, lp.y, 22, 21, bendDir);
        c.strokeStyle = heroId === 'ikun' ? '#1e293b' : '#d97706';
        c.lineWidth = heroId === 'naiwa' ? 5 : 9;
        c.lineCap = 'round'; c.lineJoin = 'round';
        c.beginPath(); c.moveTo(hipX, hipY); c.lineTo(farLeg.jx, farLeg.jy); c.lineTo(farLeg.fx, farLeg.fy); c.stroke();

        if (!opts.hideWheels && !isPlane) {
          drawSpaldingWheelOn(c, rearX, rearY, wR, wAngle);
          drawSpaldingWheelOn(c, frontX, frontY, wR, wAngle);
        }

        if (isMonster) {
          c.strokeStyle = '#fde047'; c.lineWidth = 5;
          c.beginPath(); c.moveTo(rearX, rearY); c.lineTo(seatX, seatY); c.moveTo(frontX, frontY); c.lineTo(headTopX, headTopY); c.stroke();
        }

        if ((modsObj.sawBumper || 0) > 0 && opts.hasSaw !== false) {
          drawModelOn(c, 'riotSaw', frontX + 20, frontY - 4, wAngle * 2.2, 0.52);
        }
        if ((modsObj.nitro || 0) > 0) {
          c.save(); c.translate(-58, -42 - lift); c.rotate(-0.35);
          c.fillStyle = '#0284c7'; c.strokeStyle = '#0f172a'; c.lineWidth = 2;
          c.beginPath(); c.roundRect(-7, -14, 14, 26, 5); c.fill(); c.stroke();
          c.fillStyle = '#facc15'; c.fillRect(-7, -4, 14, 5);
          c.restore();
        }

        // Diamond Frame
        c.strokeStyle = '#e11d48'; c.lineWidth = 5;
        c.beginPath();
        c.moveTo(rearX, rearY); c.lineTo(bbX, bbY); c.lineTo(seatX, seatY); c.lineTo(rearX, rearY);
        c.moveTo(bbX, bbY); c.lineTo(headBotX, headBotY); c.lineTo(headTopX, headTopY); c.lineTo(seatX + 1, seatY + 3);
        c.moveTo(headBotX, headBotY); c.quadraticCurveTo(33, -33 - lift * 0.5, frontX, frontY);
        c.stroke();
        c.strokeStyle = '#cbd5e1'; c.lineWidth = 3.8;
        c.beginPath(); c.moveTo(headTopX, headTopY); c.lineTo(22, -68 - lift); c.lineTo(handleX - 5, handleY); c.stroke();

        // Rear-Rack Sculpted Mini Hakimi Companion!
        drawModelOn(c, 'hakimi_rig', -46, -64 - lift + Math.sin(performance.now() * 0.015) * 2, 0, 0.44);

        // Front Basket + Sculpted Mini Nailoong Head + Mounted Weapons!
        c.save(); c.translate(36, -59 - lift);
        if ((modsObj.claw || 0) > 0) {
          drawModelOn(c, 'prop_magnet', 16, 0, 1.57, 0.45);
        }
        drawModelOn(c, 'nailong_head', 0, -11, 0, 0.34);
        c.fillStyle = '#d97706'; c.strokeStyle = '#0f172a'; c.lineWidth = 2;
        c.beginPath(); c.roundRect(-11, -3, 22, 14, 3); c.fill(); c.stroke();
        if (opts.weaponId === 'gatling') drawModelOn(c, 'gatlingGun', 18, -8, 0, 0.95);
        else if (opts.weaponId === 'bazooka') drawModelOn(c, 'bazookaGun', 12, -16, -0.12, 0.95);
        c.restore();

        // Near Leg + SCULPTED 2.5D MAIN RIDER!
        const nLeg = solveIK(hipX + 2, hipY, rp.x, rp.y, 22, 21, bendDir);
        const legCol = heroId === 'ikun' ? '#1e293b' : (heroId === 'nailong' ? '#facc15' : '#eab308');
        c.strokeStyle = legCol;
        c.lineWidth = heroId === 'nailong' ? 11 : (heroId === 'naiwa' ? 5 : 9);
        c.beginPath(); c.moveTo(hipX + 2, hipY); c.lineTo(nLeg.jx, nLeg.jy); c.lineTo(nLeg.fx, nLeg.fy); c.stroke();

        if (heroId === 'nailong') {
          drawModelOn(c, 'nailong_torso', -14, -72 - lift + jig * 0.3, 0, 0.96);
          drawModelOn(c, 'nailong_head', -6, -109 - lift + jig * 0.42, Math.sin(performance.now() * 0.008) * 0.04, 0.94);
          // Chubby Dragon Arm gripping Handlebar
          c.strokeStyle = '#292524'; c.lineWidth = 13;
          c.beginPath(); c.moveTo(-4, -80 - lift); c.lineTo(handleX, handleY); c.stroke();
          c.strokeStyle = '#facc15'; c.lineWidth = 9; c.stroke();
        } else if (heroId === 'ikun') {
          drawModelOn(c, 'ikun_torso', -14, -77 - lift + jig * 0.25, 0, 0.96);
          drawModelOn(c, 'ikun_head', -10, -113 - lift + jig * 0.35, 0, 0.96);
          c.strokeStyle = '#1e293b'; c.lineWidth = 8.5;
          c.beginPath(); c.moveTo(-6, -86 - lift); c.quadraticCurveTo(5, -76 - lift, handleX, handleY); c.stroke();
        } else if (heroId === 'pelican') {
          drawModelOn(c, 'pelican_rig', -4, -88 - lift + jig * 0.3, 0, 0.94);
        } else if (heroId === 'naiwa') {
          drawModelOn(c, 'naiwa_rig', -8, -92 - lift + jig * 0.38, 0, 0.94);
          c.strokeStyle = '#eab308'; c.lineWidth = 5;
          c.beginPath(); c.moveTo(-2, -80 - lift); c.lineTo(handleX, handleY); c.stroke();
        } else {
          drawModelOn(c, 'hakimi_rig', -8, -90 - lift + jig * 0.3, 0, 0.96);
          c.strokeStyle = '#fb923c'; c.lineWidth = 8.5;
          c.beginPath(); c.moveTo(-4, -78 - lift); c.lineTo(handleX, handleY); c.stroke();
        }

        if (opts.striking) {
          c.strokeStyle = '#fde047'; c.lineWidth = 6.5;
          c.beginPath(); c.arc(18, -60 - lift, 58, -0.8, 0.8); c.stroke();
        }

        c.restore();
      }

      // Live Hub Preview Renderer!
      function renderHubPreview(now) {
        if (state !== 'HUB') return;
        const cw = hubPreviewCanvas.clientWidth || 360;
        const ch = hubPreviewCanvas.clientHeight || 118;
        if (hubPreviewCanvas.width !== Math.floor(cw * dpr)) {
          hubPreviewCanvas.width = Math.floor(cw * dpr);
          hubPreviewCanvas.height = Math.floor(ch * dpr);

        pCtx.restore();
