      function drawAtmosphereAndScenery(camX) {
        const st = STAGES[stageIndex];
        const sg = ctx.createLinearGradient(0, 0, 0, H);
        sg.addColorStop(0, st.skyTop); sg.addColorStop(0.58, st.skyMid); sg.addColorStop(1, st.skyBot);
        ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);

        // Smooth cross-fade from previous chapter sky so biome transitions never flash!
        if (stageFadeTimer > 0 && prevStageIndex !== stageIndex) {
          const pst = STAGES[prevStageIndex];
          ctx.save();
          ctx.globalAlpha = stageFadeTimer;
          const psg = ctx.createLinearGradient(0, 0, 0, H);
          psg.addColorStop(0, pst.skyTop); psg.addColorStop(0.58, pst.skyMid); psg.addColorStop(1, pst.skyBot);
          ctx.fillStyle = psg; ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }

        if (bonusSkyAlpha > 0.01) {
          ctx.save();
          ctx.globalAlpha = bonusSkyAlpha;
          const rg = ctx.createLinearGradient(0, 0, 0, H);
          rg.addColorStop(0, '#4f46e5'); rg.addColorStop(0.45, '#ec4899'); rg.addColorStop(1, '#fef08a');
          ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
          for (let sx = -60; sx < W + 120; sx += 140) {
            const ox = sx - ((camX * 0.25) % 140);
            ctx.beginPath();
            ctx.arc(ox, H * 0.68, 42, 0, Math.PI * 2);
            ctx.arc(ox + 38, H * 0.66, 52, 0, Math.PI * 2);
            ctx.arc(ox + 78, H * 0.69, 38, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
          if (bonusSkyAlpha >= 0.98) return;
        }

        ctx.save();
        drawSpaldingWheelOn(ctx, W * 0.82, H * 0.16, 24, performance.now() * 0.0008);
        if (st.id === 'court') {
          for (let sx = -80; sx < W + 140; sx += 170) {
            const ox = sx - ((camX * 0.18) % 170);
            ctx.fillStyle = 'rgba(30, 41, 59, 0.28)';
            ctx.beginPath(); ctx.moveTo(ox, H * 0.68); ctx.lineTo(ox + 12, H * 0.48); ctx.lineTo(ox + 108, H * 0.48); ctx.lineTo(ox + 120, H * 0.68); ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'rgba(249, 115, 22, 0.42)';
            ctx.beginPath(); ctx.roundRect(ox + 8, H * 0.45, 104, 9, 4); ctx.fill();
          }
        } else if (st.id === 'site') {
          for (let sx = -80; sx < W + 160; sx += 220) {
            const ox = sx - ((camX * 0.2) % 220);
            ctx.strokeStyle = 'rgba(69, 26, 3, 0.4)'; ctx.lineWidth = 3;
            ctx.strokeRect(ox, H * 0.22, 18, H * 0.46);
            ctx.beginPath(); ctx.moveTo(ox - 45, H * 0.24); ctx.lineTo(ox + 115, H * 0.24); ctx.lineTo(ox + 9, H * 0.16); ctx.closePath(); ctx.stroke();
          }
        } else if (st.id === 'swamp') {
          for (let sx = -70; sx < W + 140; sx += 165) {
            const ox = sx - ((camX * 0.22) % 165);
            ctx.fillStyle = 'rgba(6, 78, 59, 0.48)';
            ctx.beginPath(); ctx.arc(ox + 36, H * 0.40, 38, 0, Math.PI * 2); ctx.fill();
            ctx.fillRect(ox + 28, H * 0.40, 16, H * 0.28);
          }
        } else if (st.id === 'snow') {
          // Crisp Alpine Snow Mountains + Falling Snowflakes!
          for (let sx = -100; sx < W + 180; sx += 190) {
            const ox = sx - ((camX * 0.16) % 190);
            ctx.fillStyle = 'rgba(148, 163, 184, 0.48)';
            ctx.beginPath(); ctx.moveTo(ox - 20, H * 0.70); ctx.lineTo(ox + 75, H * 0.26); ctx.lineTo(ox + 175, H * 0.70); ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.beginPath(); ctx.moveTo(ox + 45, H * 0.40); ctx.lineTo(ox + 75, H * 0.26); ctx.lineTo(ox + 105, H * 0.40); ctx.lineTo(ox + 85, H * 0.37); ctx.lineTo(ox + 68, H * 0.42); ctx.closePath(); ctx.fill();
          }
          ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
          const stNow = performance.now() * 0.05;
          for (let i = 0; i < 24; i++) {
            const fx = ((i * 73 - camX * 0.35 + stNow) % (W + 40) + (W + 40)) % (W + 40) - 20;
            const fy = ((i * 59 + stNow * 1.6) % (H * 0.72));
            ctx.beginPath(); ctx.arc(fx, fy, 2.2 + (i % 3), 0, Math.PI * 2); ctx.fill();
          }
        } else if (st.id === 'volcano') {
          // Smoking Magma Volcano Cones!
          for (let sx = -90; sx < W + 200; sx += 220) {
            const ox = sx - ((camX * 0.19) % 220);
            ctx.fillStyle = 'rgba(28, 25, 23, 0.72)';
            ctx.beginPath();
            ctx.moveTo(ox - 10, H * 0.70); ctx.lineTo(ox + 65, H * 0.30);
            ctx.lineTo(ox + 115, H * 0.30); ctx.lineTo(ox + 190, H * 0.70); ctx.closePath(); ctx.fill();
            ctx.fillStyle = 'rgba(249, 115, 22, 0.78)';
            ctx.beginPath();
            ctx.moveTo(ox + 65, H * 0.30); ctx.lineTo(ox + 115, H * 0.30);
            ctx.lineTo(ox + 100, H * 0.44); ctx.lineTo(ox + 88, H * 0.37); ctx.lineTo(ox + 75, H * 0.46); ctx.closePath(); ctx.fill();
          }
        } else if (st.id === 'bamboo') {
          // Towering Jade Bamboo Forest & Silhouettes!
          for (let sx = -40; sx < W + 90; sx += 68) {
            const ox = sx - ((camX * 0.23) % 68);
            ctx.fillStyle = 'rgba(6, 78, 59, 0.45)';
            ctx.fillRect(ox, H * 0.14, 11, H * 0.56);
            ctx.fillStyle = 'rgba(167, 243, 208, 0.38)';
            for (let ny = H * 0.2; ny < H * 0.65; ny += 46) ctx.fillRect(ox - 2, ny, 15, 3);
          }
        } else {
          for (let sx = -50; sx < W + 130; sx += 118) {
            const idx = Math.floor((sx + camX * 0.24) / 118);
            const ox = sx - ((camX * 0.24) % 118);
            const bh = 145 + (Math.abs(idx * 53) % 95);
            const topY = H * 0.68 - bh;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
            ctx.beginPath(); ctx.moveTo(ox, H * 0.7); ctx.lineTo(ox, topY + 14); ctx.lineTo(ox + 14, topY); ctx.lineTo(ox + 76, topY); ctx.lineTo(ox + 76, H * 0.7); ctx.closePath(); ctx.fill();
            ctx.fillStyle = idx % 2 === 0 ? 'rgba(56, 189, 248, 0.4)' : 'rgba(244, 114, 182, 0.4)';
            for (let wy = topY + 20; wy < H * 0.62; wy += 18) {
              for (let wx = ox + 10; wx < ox + 64; wx += 16) ctx.fillRect(wx, wy, 9, 10);
            }
          }
        }
        ctx.restore();
      }

      // Clean Visual Shrinking Ring (ZERO tutorial text!)
      function drawParryRing(cx, cy, dist) {
        const ratio = Math.max(0, Math.min(1.5, (dist - 115) / 225));
        const inZone = dist <= 175;
        ctx.save(); ctx.translate(cx, cy);
        ctx.strokeStyle = inZone ? '#fde047' : 'rgba(253,224,71,0.6)';
        ctx.lineWidth = inZone ? 4.5 : 2.5;
        ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = inZone ? '#4ade80' : '#ffffff';
        ctx.lineWidth = 3.5; ctx.setLineDash([8, 5]);
        ctx.beginPath(); ctx.arc(0, 0, 26 + ratio * 42, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }

      function render() {
        ctx.save();
        ctx.scale(dpr, dpr);

        const { worldScale, camX, camY } = getCamera();
        drawAtmosphereAndScenery(camX);

        // High-Speed Wind Lines
        if (speedLines.length > 0) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.52)';
          ctx.lineWidth = 3;
          for (const sl of speedLines) {
            ctx.beginPath(); ctx.moveTo(sl.x, sl.y); ctx.lineTo(sl.x + sl.len, sl.y); ctx.stroke();
          }
        }

        ctx.save();
        if (shakeTime > 0) {
          ctx.translate((Math.random() - 0.5) * shakeMag, (Math.random() - 0.5) * shakeMag);
        }
        ctx.scale(worldScale, worldScale);
        ctx.translate(-camX, -camY);

        const startWX = camX - 90;
        const endWX = camX + W / worldScale + 150;
        const st = STAGES[stageIndex];

        if (superBonusTimer > 0) {
          // Rainbow Cloud Highway!
          const rg = ctx.createLinearGradient(startWX, -220, endWX, -220);
          rg.addColorStop(0, '#f43f5e'); rg.addColorStop(0.25, '#fde047'); rg.addColorStop(0.5, '#4ade80'); rg.addColorStop(0.75, '#38bdf8'); rg.addColorStop(1, '#c084fc');
          ctx.strokeStyle = rg; ctx.lineWidth = 22;
          ctx.beginPath(); ctx.moveTo(startWX, -214); ctx.lineTo(endWX, -214); ctx.stroke();
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(startWX, -224); ctx.lineTo(endWX, -224); ctx.stroke();
        } else {
          // Ground & Segmented Highway
          ctx.fillStyle = st.grass;
          ctx.beginPath();
          ctx.moveTo(startWX, camY + H / worldScale + 280);
          for (let wx = startWX; wx <= endWX; wx += 12) ctx.lineTo(wx, getTerrainStateAt(wx).y);
          ctx.lineTo(endWX, camY + H / worldScale + 280);
          ctx.closePath(); ctx.fill();

          ctx.strokeStyle = st.road; ctx.lineWidth = 18;
          ctx.beginPath();
          let penDown = false;
          for (let wx = startWX; wx <= endWX; wx += 12) {
            const ts = getTerrainStateAt(wx);
            if (ts.isPit) penDown = false;
            else {
              if (!penDown) { ctx.moveTo(wx, ts.y + 5); penDown = true; }
              else ctx.lineTo(wx, ts.y + 5);
            }
          }
          ctx.stroke();

          // Pits, Lava Rivers & Steel Truss Bridges
          for (const pit of pits) {
            if (pit.x > endWX) continue;
            const y1 = getBaseSurfaceY(pit.x), y2 = getBaseSurfaceY(pit.x + pit.len);
            if (pit.lava && !pit.bridged) {
              ctx.fillStyle = '#ea580c';
              ctx.fillRect(pit.x, y1 + 52, pit.len, 180);
              ctx.fillStyle = '#fde047';
              ctx.fillRect(pit.x, y1 + 52, pit.len, 8);
            }
            ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2;
            ctx.fillRect(pit.x - 14, y1 - 26, 14, 28); ctx.strokeRect(pit.x - 14, y1 - 26, 14, 28);
            ctx.fillRect(pit.x + pit.len, y2 - 26, 14, 28); ctx.strokeRect(pit.x + pit.len, y2 - 26, 14, 28);
            if (pit.bridged) {
              ctx.fillStyle = '#334155';
              ctx.beginPath(); ctx.moveTo(pit.x - 8, y1); ctx.lineTo(pit.x + pit.len + 8, y2); ctx.lineTo(pit.x + pit.len + 8, y2 + 16); ctx.lineTo(pit.x - 8, y1 + 16); ctx.closePath(); ctx.fill(); ctx.stroke();
              ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2.4;
              ctx.beginPath();
              for (let bx = pit.x; bx < pit.x + pit.len; bx += 28) {
                ctx.moveTo(bx, y1 + 2); ctx.lineTo(bx + 28, y1 + 15); ctx.moveTo(bx + 28, y1 + 2); ctx.lineTo(bx, y1 + 15);
              }
              ctx.stroke();
            }
          }

          // Glossy Alpine Ice Speed Slopes!
          for (const iz of iceZones) {
            if (iz.x > endWX) continue;
            ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 15;
            ctx.beginPath();
            for (let wx = iz.x; wx <= iz.x + iz.len; wx += 16) {
              const wy = getBaseSurfaceY(wx) + 3;
              if (wx === iz.x) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
            }
            ctx.stroke();
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
            ctx.stroke();
          }

          // Physical 500m Checkpoint Flags!
          for (const fl of checkpointFlags) {
            if (fl.x > endWX) continue;
            const fy = getBaseSurfaceY(fl.x);
            ctx.save(); ctx.translate(fl.x, fy);
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(0, -110); ctx.stroke();
            ctx.fillStyle = fl.passed ? '#4ade80' : '#f97316';
            ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(0, -108); ctx.lineTo(54, -92); ctx.lineTo(0, -76); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#0f172a'; ctx.font = '900 10px sans-serif';
            ctx.fillText(`${fl.dist}m`, 6, -89);
            ctx.restore();
          }

          for (const mz of mudZones) {
            if (mz.x > endWX) continue;
            ctx.strokeStyle = mz.dried ? '#ca8a04' : '#7e22ce'; ctx.lineWidth = 15;
            ctx.beginPath();
            for (let wx = mz.x; wx <= mz.x + mz.len; wx += 16) {
              const wy = getBaseSurfaceY(wx) + 4;
              if (wx === mz.x) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
            }
            ctx.stroke();
          }

          for (const lp of lilyPads) {
            if (lp.x <= endWX) drawModel('lotusPad', lp.x, getBaseSurfaceY(lp.x) - lp.yOff + lp.anim * 8);
          }

          for (const gy of geysers) {
            if (gy.x > endWX) continue;
            const by = getBaseSurfaceY(gy.x);
            if (Math.sin(gy.phase) > -0.25) {
              const t = performance.now() * 0.008;
              for (let k = 0; k < 8; k++) {
                const frac = ((k / 8) + (t % 1)) % 1;
                ctx.fillStyle = `rgba(186, 230, 253, ${0.85 - frac * 0.65})`;
                ctx.beginPath(); ctx.arc(gy.x + Math.sin(frac * Math.PI) * 12 * (k % 2 ? 1 : -1), by - frac * 185, 11 + frac * 13, 0, Math.PI * 2); ctx.fill();
              }
            }
            ctx.fillStyle = '#475569'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.2;
            ctx.beginPath(); ctx.ellipse(gy.x, by - 2, 24, 10, 0, Math.PI, 0); ctx.fill(); ctx.stroke();
          }

          for (const cp of catapults) {
            if (cp.x > endWX) continue;
            const cy = getBaseSurfaceY(cp.x);
            ctx.save(); ctx.translate(cp.x, cy);
            ctx.fillStyle = '#475569'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.2;
            ctx.beginPath(); ctx.moveTo(-13, 2); ctx.lineTo(0, -18); ctx.lineTo(13, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.save(); ctx.rotate(cp.fired ? 0.24 : -0.22);
            ctx.fillStyle = '#b45309'; ctx.beginPath(); ctx.roundRect(-42, -22, 84, 9, 3); ctx.fill(); ctx.stroke();
            if (!cp.fired) drawModel('tntBarrel', 26, -38, 0.12, 0.68);
            ctx.restore(); ctx.restore();
          }

          for (const rl of rails) {
            if (rl.x > endWX) continue;
            const x1 = rl.x, x2 = rl.x + rl.len;
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(x1, getBaseSurfaceY(x1)); ctx.lineTo(x1, getBaseSurfaceY(x1) - rl.hOff); ctx.moveTo(x2, getBaseSurfaceY(x2)); ctx.lineTo(x2, getBaseSurfaceY(x2) - rl.hOff); ctx.stroke();
            ctx.strokeStyle = rl.energizedTimer > 0 ? '#fde047' : (rl.kind === 'maglev' ? '#38bdf8' : '#f8fafc');
            ctx.lineWidth = rl.energizedTimer > 0 ? 9 : 6.5;
            ctx.beginPath();
            for (let wx = x1; wx <= x2; wx += 16) {
              const ry = getBaseSurfaceY(wx) - rl.hOff;
              if (wx === x1) ctx.moveTo(wx, ry); else ctx.lineTo(wx, ry);
            }
            ctx.stroke();
          }

          for (const bb of backboards) {
            if (bb.x > endWX + 50) continue;
            ctx.save(); ctx.translate(bb.x, bb.y);
            ctx.fillStyle = bb.triggered ? '#dcfce7' : '#f8fafc'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.roundRect(8, -42, 16, 56, 4); ctx.fill(); ctx.stroke();
            ctx.fillStyle = bb.triggered ? '#22c55e' : '#ef4444';
            ctx.beginPath(); ctx.arc(-2, -14, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-2, -14, 6, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = bb.triggered ? '#22c55e' : '#f97316'; ctx.lineWidth = 4.5;
            ctx.beginPath(); ctx.ellipse(-8, 5, 19, 5.5, 0, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
          }

          for (const br of barrels) {
            if (!br.exploded && br.x <= endWX) drawModel('tntBarrel', br.x, br.y);
          }

          for (const ct of cashTrucks) {
            if (ct.dead || ct.x > endWX + 80) continue;
            ctx.save();
            if (ct.flash > 0) ctx.filter = 'brightness(1.8)';
            drawModel('cashTruck', ct.x, ct.y - 34, getTerrainSlope(ct.x));
            ctx.restore();
          }

          for (const hg of hangers) {
            if (hg.x > endWX + 60) continue;
            ctx.save();
            if (!hg.fallen) {
              ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2.5;
              for (let cy = hg.ropeTopY; cy < hg.boardY - 22; cy += 12) {
                ctx.beginPath(); ctx.ellipse(hg.x, cy, 4, 6.5, 0, 0, Math.PI * 2); ctx.stroke();
              }
            }
            ctx.translate(hg.x, hg.boardY);
            if (hg.kind === 'chandelier') {
              drawSpaldingWheelOn(ctx, 0, 0, 26, 0.3);
            } else {
              ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 3;
              ctx.beginPath(); ctx.roundRect(-48, -20, 96, 36, 7); ctx.fill(); ctx.stroke();
              ctx.fillStyle = '#fde047'; ctx.font = '900 11px sans-serif'; ctx.textAlign = 'center';
              ctx.fillText('鸡你太美', 0, 3);
            }
            ctx.restore();
          }

          for (const bl of bells) {
            if (bl.x <= endWX) drawModel('bronzeBell', bl.x, bl.y, bl.rungTimer > 0 ? Math.sin(performance.now() * 0.04) * 0.32 : 0);
          }

          for (const lg of laserGates) {
            if (lg.x > endWX + 60) continue;
            const gy = getBaseSurfaceY(lg.x);
            const swX = lg.x - 98, swY = getBaseSurfaceY(swX) - 24;
            ctx.save(); ctx.translate(swX, swY);
            ctx.fillStyle = '#334155'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.4;
            ctx.beginPath(); ctx.roundRect(-16, -22, 32, 42, 5); ctx.fill(); ctx.stroke();
            ctx.fillStyle = lg.hacked ? '#22c55e' : '#ef4444'; ctx.beginPath(); ctx.arc(0, 2, 6, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fde047'; ctx.lineWidth = 3.5;
            ctx.beginPath(); ctx.moveTo(16, -4); ctx.lineTo(25, lg.hacked ? 12 : -16); ctx.stroke();
            ctx.restore();

            ctx.save(); ctx.translate(lg.x, gy);
            ctx.strokeStyle = lg.hacked ? 'rgba(74, 222, 128, 0.45)' : 'rgba(244, 63, 94, 0.6)';
            ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, -136); ctx.stroke();
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3.5;
            ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, -136); ctx.stroke();
            ctx.fillStyle = '#334155'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.4;
            ctx.beginPath(); ctx.roundRect(-15, -18, 30, 20, 4); ctx.roundRect(-15, -152, 30, 20, 4); ctx.fill(); ctx.stroke();
            ctx.restore();
          }

          // Telegraphed Multi-Skill Boss Arena Hazards (Lasers, Poison/Magma Eruptions, Air-Strike Radar!)
          for (const hz of bossHazards) {
            if (hz.delay > 0) continue;
            if (hz.kind === 'laser_sweep') {
              const beamY = getBaseSurfaceY(player.x) - hz.hOff;
              const endX = activeBoss ? activeBoss.worldX - 20 : endWX;
              ctx.save();
              if (hz.warn > 0) {
                const blink = 0.45 + 0.45 * Math.abs(Math.sin(performance.now() * 0.025));
                ctx.strokeStyle = hz.color || '#f43f5e';
                ctx.globalAlpha = blink;
                ctx.lineWidth = 5;
                ctx.setLineDash([16, 10]);
                ctx.beginPath();
                ctx.moveTo(player.x - 160, beamY);
                ctx.lineTo(endX, beamY);
                ctx.stroke();
              } else {
                ctx.strokeStyle = hz.color || '#f43f5e';
                ctx.lineWidth = 26;
                ctx.globalAlpha = 0.72;
                ctx.beginPath(); ctx.moveTo(player.x - 180, beamY); ctx.lineTo(endX, beamY); ctx.stroke();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 9;
                ctx.globalAlpha = 0.96;
                ctx.beginPath(); ctx.moveTo(player.x - 180, beamY); ctx.lineTo(endX, beamY); ctx.stroke();
              }
              ctx.restore();
            } else {
              const hx = hz.worldX;
              const hy = getBaseSurfaceY(hx);
              ctx.save();
              if (hz.warn > 0) {
                const urgency = 1 - hz.warn / (hz.maxWarn || 0.75);
                ctx.fillStyle = hz.kind === 'air_strike' ? 'rgba(239, 68, 68, 0.28)' : 'rgba(250, 204, 21, 0.32)';
                ctx.fillRect(hx - 28, hy - 145, 56, 148);
                ctx.strokeStyle = hz.color || '#ef4444';
                ctx.lineWidth = hz.locked ? 4 : 2.5;
                ctx.beginPath();
                ctx.ellipse(hx, hy - 2, 30, 9, 0, 0, Math.PI * 2);
                ctx.stroke();
                if (hz.kind === 'air_strike') {
                  ctx.setLineDash([8, 6]);
                  ctx.beginPath(); ctx.moveTo(hx, hy - 220); ctx.lineTo(hx, hy - 6); ctx.stroke();
                  ctx.setLineDash([]);
                } else {
                  ctx.fillStyle = hz.color || '#84cc16';
                  ctx.fillRect(hx - 24, hy - 8 - urgency * 10, 48, 10 + urgency * 10);
                }
              } else {
                const grad = ctx.createLinearGradient(hx, hy, hx, hy - 155);
                grad.addColorStop(0, hz.color || '#f97316');
                grad.addColorStop(0.6, '#fde047');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(hx - 26, hy - 150, 52, 152, 16);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.roundRect(hx - 10, hy - 142, 20, 142, 8);
                ctx.fill();
              }
              ctx.restore();
            }
          }

          // Rolling Giant Alpine Snowballs!
          for (const sb of snowballs) {
            if (!sb.smashed && sb.x <= endWX + 50) {
              drawModel('snowballGiant', sb.x, sb.y, sb.rot);
            }
          }

          // Sculpted Enemies (8 Types including Flying Drones & Charging Boars!) & 4 Sculpted Bosses!
          for (const en of enemies) {
            if (en.hit || en.x > endWX) continue;
            const ey = getEnemyWorldY(en);
            const hop = en.flyH ? 0 : Math.abs(Math.sin(performance.now() * 0.008 + (en.phase || 0))) * 6;
            drawModel(getEnemySpriteKey(en.kind), en.x, ey - 28 - hop);
          }

          if (activeBoss) {
            const groundBY = getBaseSurfaceY(activeBoss.worldX);
            const bx = activeBoss.worldX, by = groundBY - 52 + activeBoss.yOff;
            ctx.save();
            // Sky-Slam ground impact shadow warning!
            if (activeBoss.slamPhase) {
              ctx.fillStyle = 'rgba(239, 68, 68, 0.42)';
              ctx.beginPath(); ctx.ellipse(bx, groundBY - 2, 54, 13, 0, 0, Math.PI * 2); ctx.fill();
            }
            // Enraged Phase 2 / Phase 3 Aura Ring!
            if (activeBoss.phase >= 2) {
              const pulseR = 62 + Math.sin(performance.now() * 0.018) * 9;
              ctx.strokeStyle = activeBoss.phase >= 3 ? 'rgba(239, 68, 68, 0.72)' : 'rgba(250, 204, 21, 0.65)';
              ctx.lineWidth = activeBoss.phase >= 3 ? 6 : 4;
              ctx.beginPath(); ctx.arc(bx, by, pulseR, 0, Math.PI * 2); ctx.stroke();
            }
            // Dash-Charge Clash Ring!
            if (activeBoss.chargePhase) {
              const d = Math.abs(bx - (player.x + 36));
              drawParryRing(bx - 18, by + 6, d);
            }
            if (activeBoss.flashTimer > 0) ctx.filter = 'brightness(1.9)';
            const bossRot = activeBoss.chargePhase === 'dashing' ? -0.14 : (activeBoss.stunTimer > 0 ? 0.14 : 0);
            const bossScale = 1.15 + (activeBoss.tier - 1) * 0.05;
            drawModel(activeBoss.sprite || (activeBoss.kind === 'titan_naiwa' ? 'boss_naiwa' : 'boss_hakimi'), bx, by, bossRot, bossScale);
            ctx.restore();
          }

          for (const sh of enemyShots) {
            if (sh.kind === 'spike_roller') {
              drawModel('riotSaw', sh.x, sh.y - 22, sh.rot, 0.92);
            } else if (sh.kind === 'hover_saw') {
              drawModel('riotSaw', sh.x, sh.y, sh.rot, 0.88);
            } else if (sh.kind === 'bounce_bball' || sh.kind === 'dunk_meteor') {
              drawSpaldingWheelOn(ctx, sh.x, sh.y, 21, sh.rot || performance.now() * 0.015);
              if (!sh.parried) {
                const d = Math.hypot(sh.x - (player.x + 28), sh.y - (player.y - 46));
                drawParryRing(sh.x, sh.y, d);
              }
            } else {
              drawModel('lawyerScroll', sh.x, sh.y, sh.rot);
              if (!sh.parried) {
                const d = Math.hypot(sh.x - (player.x + 28), sh.y - (player.y - 46));
                drawParryRing(sh.x, sh.y, d);
              }
            }
          }
        }

        // Direct 3D Props on Track (Clean visual glow, ZERO text!)
        for (const wp of worldProps) {
          if (wp.taken || wp.x > endWX + 40) continue;
          drawModel(wp.def.sprite, wp.x, wp.y, Math.sin(wp.phase) * 0.1);
        }

        // 3D Bean Jars & 10x Giant Golden Jars!
        const nowT = performance.now() * 0.005;
        for (const b of beans) {
          if (b.taken || b.x > endWX) continue;
          const bob = b.dynamic ? 0 : Math.sin(nowT + b.x * 0.02) * 4;
          drawModel(b.giant ? 'goldJar' : 'beanJar', b.x, b.y + bob);
        }

        if (player.kunai) {
          drawModel('kunai', player.kunai.x, player.kunai.y, player.kunai.stuck ? -0.35 : Math.atan2(player.kunai.vy, player.kunai.vx));
        }

        for (const pr of projectiles) {
          if (pr.kind === 'ikun_pinball') {
            // Glowing Curved Homing Comet Trail + Lock-On Reticle!
            if (pr.trail && pr.trail.length > 1) {
              for (let ti = 1; ti < pr.trail.length; ti++) {
                const frac = ti / pr.trail.length;
                ctx.strokeStyle = `rgba(251, 146, 60, ${frac * 0.78})`;
                ctx.lineWidth = frac * pr.r * 1.15;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(pr.trail[ti - 1].x, pr.trail[ti - 1].y);
                ctx.lineTo(pr.trail[ti].x, pr.trail[ti].y);
                ctx.stroke();
              }
            }
            if (pr.lockPos) {
              ctx.save();
              ctx.translate(pr.lockPos.x, pr.lockPos.y);
              ctx.strokeStyle = 'rgba(253, 224, 71, 0.85)';
              ctx.lineWidth = 2.5;
              ctx.setLineDash([5, 4]);
              ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.stroke();
              ctx.restore();
            }
            drawSpaldingWheelOn(ctx, pr.x, pr.y, pr.r, pr.rot);
          } else if (pr.kind === 'riot_saw') drawModel('riotSaw', pr.x, pr.y, pr.rot);
          else if (pr.kind === 'shark_bomb') drawModel('sharkBomb', pr.x, pr.y, Math.atan2(pr.vy, 420) * 0.45);
          else if (pr.kind === 'bowling_mob') drawModel(getEnemySpriteKey(pr.mobKind), pr.x, pr.y, pr.rot);
          else if (pr.kind === 'fish_shot') drawModel('fishTorpedo', pr.x, pr.y, Math.atan2(pr.vy, 500) * 0.5);
          else drawSpaldingWheelOn(ctx, pr.x, pr.y, pr.r, pr.rot);
        }

        for (const fp of flamePuffs) {
          const u = Math.max(0, fp.life / fp.maxLife);
          const fg = ctx.createRadialGradient(fp.x - fp.r * 0.2, fp.y - fp.r * 0.2, 2, fp.x, fp.y, fp.r);
          if (u > 0.65) { fg.addColorStop(0, '#ffffff'); fg.addColorStop(0.55, '#fde047'); fg.addColorStop(1, 'rgba(249, 115, 22, 0)'); }
          else if (u > 0.3) { fg.addColorStop(0, '#fde047'); fg.addColorStop(0.55, '#ef4444'); fg.addColorStop(1, 'rgba(185, 28, 28, 0)'); }
          else { fg.addColorStop(0, 'rgba(120, 53, 15, 0.65)'); fg.addColorStop(1, 'rgba(30, 41, 59, 0)'); }
          ctx.fillStyle = fg;
          ctx.beginPath(); ctx.arc(fp.x, fp.y, fp.r, 0, Math.PI * 2); ctx.fill();
        }

        if (player.ropeTimer > 0 && player.ropeAnchor) {
          ctx.strokeStyle = '#fb7185'; ctx.lineWidth = 7; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(player.x + 6, player.y - 88); ctx.lineTo(player.ropeAnchor.x, player.ropeAnchor.y); ctx.stroke();
        }
        for (const sl of player.slashLines) {
          ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 9;
          ctx.beginPath(); ctx.moveTo(sl.x1, sl.y1); ctx.lineTo(sl.x2, sl.y2); ctx.stroke();
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3.5; ctx.stroke();
        }
        for (const sw of shockwaves) {
          ctx.strokeStyle = sw.color || '#f97316'; ctx.lineWidth = 5;
          ctx.globalAlpha = Math.max(0, sw.life / 0.38);
          ctx.beginPath(); ctx.arc(sw.x, sw.y - 14, sw.r, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = 1;
        }

        // Main Sculpted Player & Bike (Scales 1.95x during Tiantian Kupao Giant Spicy Mode!)
        ctx.save();
        if (player.invulnTimer > 0 && state === 'PLAYING' && player.giantTimer <= 0 && headStartTargetDist <= 0 && Math.floor(player.invulnTimer * 14) % 2 === 0) {
          ctx.globalAlpha = 0.55;
        }
        drawSculptedBikeAndHero(
          ctx,
          activeRunHeroId,
          player.x,
          player.y,
          player.angle,
          player.wheelAngle,
          player.crankAngle,
          player.jiggle,
          save.mods,
          {
            scale: player.giantTimer > 0 ? 1.92 : 1.0,
            mountId: player.mountId,
            weaponId: player.weaponId,
            striking: player.strikeTimer > 0,
            hasSaw: player.sawShieldCharges > 0,
            hideWheels: state === 'DYING',
            rocketDash: headStartTargetDist > 0 || player.rocketDashTimer > 0
          }
        );
        ctx.restore();

        if (player.orbitSawTimer > 0) {
          const baseA = performance.now() * 0.01;
          for (let k = 0; k < 2; k++) {
            const a = baseA + k * Math.PI;
            drawModel('riotSaw', player.x + Math.cos(a) * 82, (player.y - 48) + Math.sin(a) * 60, baseA * 3, 0.72);
          }
        }

        for (const d of flyingDebris) {
          if (d.kind === 'loose_wheel') drawSpaldingWheelOn(ctx, d.x, d.y, d.r, d.rot);
          else if (d.kind === 'ko_mob') drawModel(getEnemySpriteKey(d.mobKind), d.x, d.y, d.rot, 0.85);
          else drawModel(d.kind === 'woodSplinter' ? 'woodSplinter' : 'rockChunk', d.x, d.y, d.rot);
        }

        for (const pop of popups) {
          ctx.globalAlpha = Math.max(0, pop.life / pop.maxLife);
          ctx.font = `900 ${pop.size}px -apple-system, "PingFang SC", sans-serif`;
          ctx.textAlign = 'center';
          ctx.lineWidth = 4; ctx.strokeStyle = '#0f172a';
          ctx.strokeText(pop.text, pop.x, pop.y);
          ctx.fillStyle = pop.color;
          ctx.fillText(pop.text, pop.x, pop.y);
        }
        ctx.globalAlpha = 1;

        ctx.restore();

        if (state === 'DYING') {
          ctx.fillStyle = 'rgba(15, 23, 42, 0.38)';
          ctx.fillRect(0, 0, W, H);
        }

        ctx.restore();
      }

      function flushBeforeUnload() {
        bankRunProgress(false);
        if (authState.token && navigator.sendBeacon) {
          try {
            const blob = new Blob([JSON.stringify({
              token: authState.token,
              save
            })], { type: 'application/json' });
            navigator.sendBeacon('/api/save', blob);
          } catch (_) {}
        }
      }
      window.addEventListener('beforeunload', flushBeforeUnload);
      window.addEventListener('pagehide', flushBeforeUnload);

      let lastTime = performance.now();
      function frame(now) {
        const dt = Math.min(0.04, (now - lastTime) / 1000);
        lastTime = now;
        update(dt);
        render();
        renderHubPreview(now);
        requestAnimationFrame(frame);
      }

      refreshHubUI();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
