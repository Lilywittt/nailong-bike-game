<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 960" width="880" height="960">
  <rect width="880" height="960" rx="44" fill="#ffffff"/>
  <!-- Subtle outer & inner hairline borders -->
  <rect x="14" y="14" width="852" height="932" rx="36" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
  <rect x="24" y="24" width="832" height="912" rx="30" fill="none" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Subtle corner meme vector motifs (pure SVG geometry, NO emoji, understated opacity) -->
  <!-- Top-Left: Mini Basketball + Suspenders motif (ikun) -->
  <g transform="translate(68, 68)" stroke="#94a3b8" stroke-width="2.2" fill="none" opacity="0.65">
    <circle cx="0" cy="0" r="15" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <path d="M -15 0 L 15 0 M 0 -15 L 0 15" stroke="#ea580c" stroke-width="1.6"/>
    <path d="M -10.5 -10.5 Q -2 0 -10.5 10.5 M 10.5 -10.5 Q 2 0 10.5 10.5" stroke="#ea580c" stroke-width="1.6"/>
  </g>

  <!-- Top-Right: Mini Slanted Beret + Eighth Note vector (曼波) -->
  <g transform="translate(810, 68)" fill="none" opacity="0.68">
    <ellipse cx="-4" cy="3" rx="16" ry="8.5" transform="rotate(-14)" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <line x1="-2" y1="-5" x2="1" y2="-10" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="14" cy="9" r="3.2" fill="#ec4899"/>
    <path d="M 17 9 L 17 -4 L 24 -1" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom-Left: Mini Rounded Dragon Horns silhouette (奶龙) -->
  <g transform="translate(68, 892)" fill="none" opacity="0.68">
    <path d="M -15 8 C -16 -6, -6 -12, -3 -2 C 0 -5, 0 -5, 3 -2 C 6 -12, 16 -6, 15 8 Z" fill="#fefce8" stroke="#eab308" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-6" cy="2" r="1.6" fill="#ca8a04"/>
    <circle cx="6" cy="2" r="1.6" fill="#ca8a04"/>
    <path d="M -4 5 Q 0 8 4 5" stroke="#ca8a04" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Bottom-Right: Mini Cat Ears & Whiskers silhouette (哈基米) -->
  <g transform="translate(810, 892)" fill="none" opacity="0.68">
    <path d="M -13 8 L -15 -9 L -5 -2 Q 0 -4 5 -2 L 15 -9 L 13 8 Q 0 12 -13 8 Z" fill="#fdf2f8" stroke="#ec4899" stroke-width="2" stroke-linejoin="round"/>
    <line x1="-19" y1="2" x2="-11" y2="3" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="11" y1="3" x2="19" y2="2" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -3 4 Q 0 7 3 4" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Main Centerpiece 1: Bold Game Title (unchanged position & size!) -->
  <text x="440" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="68" font-weight="800" letter-spacing="2" fill="#0f172a">鹈鹕测试大乱斗</text>

  <!-- Delicate minimalist divider accent under title -->
  <line x1="368" y1="176" x2="426" y2="176" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="440" cy="176" r="3.5" fill="#f59e0b"/>
  <line x1="454" y1="176" x2="512" y2="176" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>

  <!-- Main Centerpiece 2: Crisp 600x600 QR Code in subtle viewfinder frame (unchanged position & size!) -->
  <rect x="116" y="206" width="648" height="648" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2.5"/>
  <!-- Subtle corner viewfinder ticks around QR frame -->
  <g stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.72">
    <path d="M 116 248 L 116 230 Q 116 206 140 206 L 158 206"/>
    <path d="M 722 206 L 740 206 Q 764 206 764 230 L 764 248"/>
    <path d="M 116 812 L 116 830 Q 116 854 140 854 L 158 854"/>
    <path d="M 722 854 L 740 854 Q 764 854 764 830 L 764 812"/>
  </g>
  <image href="data:image/png;base64," x="140" y="230" width="600" height="600" style="image-rendering: pixelated; image-rendering: crisp-edges;"/>

  <!-- Subtle bottom scan caption (unchanged position & size!) -->
  <text x="440" y="906" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="600" fill="#64748b">手机相机 / 微信扫一扫即玩</text>
</svg>
